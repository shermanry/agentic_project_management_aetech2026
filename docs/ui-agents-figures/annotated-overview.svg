<text x="484" y="174" font-size="12" fill="#161B1F" font-weight="600" text-anchor="start">2  The building, with its parts</text>
<text x="484" y="192" font-size="10.5" fill="#5F6B73" font-weight="600" text-anchor="start">Reads:</text>
<text x="528" y="192" font-size="10.5" fill="#161B1F" text-anchor="start">the site node + one node per building part, linked by “about”</text>
<text x="484" y="210" font-size="10.5" fill="#5F6B73" font-weight="600" text-anchor="start">Adds:</text>
<text x="528" y="210" font-size="10.5" fill="#161B1F" text-anchor="start">each part coloured by the open flags on things about it (roof: blocked, east face: at risk)</text>
<text x="484" y="225" font-size="10.5" fill="#5F6B73" font-weight="600" text-anchor="start"></text>
<text x="528" y="225" font-size="10.5" fill="#161B1F" text-anchor="start">click a part: photos taken there (GPS, altitude), RFIs naming that level or elevation,</text>
<text x="484" y="240" font-size="10.5" fill="#5F6B73" font-weight="600" text-anchor="start"></text>
<text x="528" y="240" font-size="10.5" fill="#161B1F" text-anchor="start">the flight that covers it, blind spots found on site, with the source page or image</text>
<text x="484" y="255" font-size="10.5" fill="#5F6B73" font-weight="600" text-anchor="start"></text>
<text x="528" y="255" font-size="10.5" fill="#161B1F" text-anchor="start">model views rendered by the converter from the real Rhino file, per layer</text>
