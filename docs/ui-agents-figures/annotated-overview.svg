<text x="402" y="449" font-size="8" fill="#5F6B73" text-anchor="end">Accept  Dismiss</text>
<text x="134" y="466" font-size="8.5" fill="#161B1F" text-anchor="start">Weather window → Flight approach</text>
<text x="402" y="466" font-size="8" fill="#5F6B73" text-anchor="end">Accept  Dismiss</text>
