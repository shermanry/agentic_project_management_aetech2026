<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>YBuild pitch (Copy)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap">
<style>
:root{--ground:#FFFFFF;--main:#141414;--second:#3A3A3A;--accent:#D08A2E;--rule:color-mix(in srgb,var(--main) 14%,var(--ground));--paper:color-mix(in srgb,var(--main) 3%,var(--ground));--soft:color-mix(in srgb,var(--accent) 16%,var(--ground));--back:#E9E9E6;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ground:#FFFFFF;--main:#141414;--second:#3A3A3A;--back:#E9E9E6;color-scheme:light}}
:root[data-theme="dark"]{--ground:#FFFFFF;--main:#141414;--second:#3A3A3A;--back:#E9E9E6;color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--back);color:var(--main);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
#view{position:absolute;inset:0;overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;background:var(--ground)}
#world{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;background-color:var(--paper);background-image:radial-gradient(color-mix(in srgb,var(--main) 18%,transparent) 1.5px,transparent 1.6px);background-size:32px 32px}
#links{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:visible}
.nd .face{transition:filter .55s ease}
.edot{fill:var(--paper);stroke-width:4;r:7px}
.gedges{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:visible;pointer-events:none}
.gl{stroke:var(--main);stroke-width:4;stroke-dasharray:12 9}
.gd{fill:var(--ground);stroke:var(--main);stroke-width:6;r:10px}
.ndot{fill:var(--ground);stroke:var(--main);stroke-width:.72px;r:1.2px}
#dots circle{transition:opacity .3s}
#stage.settled.focus #dots .edot,#stage.settled.onkid #dots .ndot{opacity:0}
#stage.soft .nd .face{border-radius:var(--r,0px);outline-color:transparent!important;filter:saturate(.85) brightness(1.03)}
#stage.soft .nd .face::after{content:"";position:absolute;inset:0;z-index:99;border-radius:inherit;border:var(--bw,0px) solid var(--main);pointer-events:none}
.fin{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:50% 50%}
#stage.soft .fin{transform:scale(var(--cs,1))}
#stage.soft .nd[data-kid],#stage.soft .ndot{transform:scale(var(--cs,1))}
.gcard{position:absolute;display:none}
.gcap{position:absolute;margin:0;font-size:32px;color:var(--main);display:flex;gap:16px;align-items:baseline}.gcap b{color:var(--accent);font-weight:600}
.nd{position:absolute;width:230.4px;height:129.6px;cursor:pointer}
.nd .face{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;transform:scale(.12);overflow:hidden;background:var(--ground);outline:var(--ow,16px) dashed var(--rule);outline-offset:calc(-1 * var(--ow,16px))}
.nd.done .face,.nd.now .face{outline:var(--ow,16px) solid var(--main)}
.nd.now .face{outline-color:var(--accent)}
.nd .lbl{position:absolute;left:0;top:141px;width:280px;margin:0;font-size:22px;color:var(--main)}
.nd.next .lbl{color:color-mix(in srgb,var(--second) 55%,var(--ground))}
.focus .nd.now .face{outline-color:transparent}
/* slide content, drawn at 1920x1080 */
.ground{position:absolute;inset:0;background:var(--ground)}
.rule{position:absolute;left:110px;right:110px;top:42px;height:1px;background:var(--rule)}
.words{position:absolute;margin:0;display:flex;flex-direction:column;gap:24px}.words>*{margin:0}
.line{font-size:120px;line-height:1.05;font-weight:300;letter-spacing:-.02em;max-width:1600px}
.sub{font-size:40px;line-height:1.35;color:var(--second);max-width:1300px}
.ph{position:absolute;left:110px;top:92px;width:1180px;height:737.5px;overflow:hidden;background:var(--paper);outline:2px dashed color-mix(in srgb,var(--main) 28%,var(--ground));outline-offset:-2px}
.tag{position:absolute;left:36px;top:26px;margin:0;font-size:20px;letter-spacing:.14em;text-transform:uppercase;color:var(--second)}
.speed{position:absolute;right:36px;top:20px;margin:0;font-size:28px;font-weight:600;color:var(--accent)}
.desc{position:absolute;left:36px;top:68px;width:1080px;margin:0;font-size:24px;line-height:1.35;color:var(--second)}
.list{position:absolute;left:36px;top:160px;width:1100px;display:flex;flex-direction:column;gap:14px}
.it{display:flex;align-items:center;gap:16px;font-size:29px;padding:13px 20px;background:var(--ground);border:1px solid var(--rule)}
.list.compact{gap:10px}.list.compact .it{font-size:25px;padding:9px 18px}
.it i{width:12px;height:12px;background:var(--main);flex:none}
.it.flag{border-color:var(--accent);background:var(--soft)}.it.flag i{background:var(--accent)}
.dec{position:absolute;left:36px;right:36px;bottom:40px;padding:20px 26px;background:var(--main);color:var(--ground);font-size:36px;font-weight:300;line-height:1.25}
.dec small{display:block;font-size:18px;letter-spacing:.14em;text-transform:uppercase;opacity:.7;margin-bottom:8px;font-weight:400}
.side{left:1350px;top:92px;width:460px;gap:22px}
.n{font-size:22px;letter-spacing:.14em;text-transform:uppercase;color:var(--second)}
.beat{font-size:50px;line-height:1.08;font-weight:300;letter-spacing:-.015em}
.st{align-self:flex-start;font-size:20px;letter-spacing:.12em;text-transform:uppercase;padding:6px 12px;border:1px solid var(--main)}
.st.staged{border-color:var(--accent);background:var(--soft);color:color-mix(in srgb,var(--accent) 60%,var(--main))}
.say{font-size:31px;line-height:1.38;padding-top:22px;border-top:1px solid var(--rule)}
.step{opacity:0;transform:translateX(30px);transition:opacity .45s ease-out,transform .45s ease-out}
.dec.step{transform:translateY(24px)}
.step.on{opacity:1;transform:none}
.mark{position:absolute;left:110px;top:70px;width:74px;color:var(--main)}
.mark svg,.biglogo svg{display:block;width:100%;height:auto}
.yb{display:inline-block;white-space:nowrap}.yb svg{display:inline-block;height:.78em;width:auto;vertical-align:-.04em;overflow:visible}.yb g[style]{color:inherit!important}
.logo-anim{position:absolute;inset:0}.logo-anim svg{position:absolute;left:210px;top:300px;width:1500px;height:auto}
.tm-links{position:absolute;left:0;top:0;width:1920px;height:1080px}.tm-links path{fill:none;stroke:var(--rule);stroke-width:2}.tm-dot{fill:var(--accent)}
.tm-logo{position:absolute;left:110px;top:120px;width:470px;color:var(--main)}.tm-logo svg{display:block;width:100%;height:auto}
.tm-copy{left:110px;bottom:120px;width:560px;gap:18px}.tm-title{margin:0;font-size:56px;line-height:1.1;font-weight:300;letter-spacing:-.02em}.tm-sub{font-size:26px;color:var(--second)}
.tm{position:absolute;margin:0;width:260px}.tm img{display:block;width:220px;height:220px;object-fit:cover;filter:grayscale(1) contrast(1.05);outline:1px solid var(--rule);background:var(--paper)}
.tm figcaption{display:inline-block;margin-top:10px;padding:4px 10px 4px 0;font-size:24px;line-height:1.2;color:var(--main);background:var(--ground)}
.team-tile{position:absolute;width:320px}
.pu-row{position:absolute;left:110px;right:110px;top:640px;display:grid;grid-template-columns:repeat(3,1fr);gap:60px}
.pu{position:relative;padding-top:34px;border-top:2px solid var(--main)}.pu .pu-dot{position:absolute;left:0;top:-9px;width:16px;height:16px;border-radius:50%;background:var(--accent)}
.pu h3{margin:0 0 14px;font-size:40px;font-weight:600;letter-spacing:-.01em}.pu p{margin:0;font-size:28px;line-height:1.4;color:var(--second);max-width:460px}
.sk{position:absolute;left:760px;top:140px;width:1050px}.sk-line{position:absolute;left:11px;top:24px;bottom:56px;width:2px;background:var(--rule)}
.sk-in{position:relative;display:flex;align-items:center;gap:30px;height:96px;font-size:30px}.sk-in b{font-weight:400;padding:12px 20px;border:2px dashed color-mix(in srgb,var(--main) 35%,var(--ground))}
.sk-row{position:relative;display:grid;grid-template-columns:24px 50px 330px 1fr;align-items:center;column-gap:20px;min-height:140px;border-top:1px solid var(--rule)}
.sk-dot{width:24px;height:24px;border-radius:50%;background:var(--main);flex:none;position:relative;z-index:1}.sk-dot.hollow{background:var(--ground);border:2px solid var(--main);box-sizing:border-box}
.sk-row.last .sk-dot{background:var(--accent)}
.sk-n{font-size:24px;color:var(--second)}.sk-name b{display:block;font-size:38px;font-weight:600;letter-spacing:-.01em}.sk-name span{display:block;margin-top:4px;font-size:24px;color:var(--second)}
.sk-out{margin:0;font-size:28px;line-height:1.35;max-width:620px}
.team-tile img{display:block;width:210px;height:210px;object-fit:cover}
.team-tile p{margin:20px 0 0;font-size:32px;line-height:1.15}
.hook-open{position:absolute;inset:0;background:var(--ground);transition:opacity .6s}
.hook-open svg{position:absolute;left:210px;top:300px;width:1500px;height:auto}
.hook-open.gone{opacity:0;pointer-events:none}
/* controls */
#bar{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;align-items:center;gap:6px;padding:6px;background:color-mix(in srgb,var(--ground) 92%,transparent);border:1px solid var(--rule);font-size:14px;z-index:5;transition:opacity .3s}
#bar.idle{opacity:0}
#bar button{font:inherit;color:var(--main);background:none;border:0;padding:8px 12px;min-height:36px;cursor:pointer}
#bar button:hover{background:var(--paper)}
#bar button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#where{padding:0 10px;color:var(--second);white-space:nowrap}
@media (prefers-reduced-motion:reduce){.step{transition:none}}
.nd[data-kid]:not(.now) .mark{display:none}
.nd[data-kid]:not(.now) .face{outline-style:solid!important;outline-color:color-mix(in srgb,var(--main) 60%,var(--ground))!important}
.ts{position:absolute;left:740px;top:90px;width:1070px;display:flex;flex-direction:column;align-items:stretch}
.ts-in{align-self:flex-end;width:870px;box-sizing:border-box;padding:16px 24px;font-size:26px;text-align:center;border:2px dashed color-mix(in srgb,var(--main) 40%,var(--ground));color:var(--second)}
.ts-arrow{align-self:flex-end;width:870px;height:34px;position:relative}.ts-arrow::before{content:"";position:absolute;left:50%;top:2px;bottom:10px;width:2px;background:var(--main)}.ts-arrow::after{content:"";position:absolute;left:calc(50% - 8px);bottom:2px;border:9px solid transparent;border-top:11px solid var(--main);border-bottom:0}
.ts-layer{display:grid;grid-template-columns:180px 1fr;column-gap:20px;align-items:stretch}
.ts-lab{display:flex;align-items:center;font-size:22px;letter-spacing:.14em;text-transform:uppercase;color:var(--second);border-top:2px solid var(--main);padding-top:6px}
.ts-boxes{display:flex;gap:20px}
.ts-box{flex:1;box-sizing:border-box;padding:18px 24px;background:var(--paper);border:2px solid var(--main)}
.ts-box.acc{background:var(--soft);border-color:var(--accent)}
.ts-top{display:flex;align-items:baseline;justify-content:space-between;gap:14px}.ts-top b{font-size:34px;font-weight:600;letter-spacing:-.01em}
.ts-chip{font-size:17px;letter-spacing:.1em;text-transform:uppercase;padding:4px 10px;border:1px solid var(--rule);background:var(--ground);color:var(--second);white-space:nowrap}
.ts-box p{margin:10px 0 0;font-size:23px;line-height:1.3;color:var(--second)}
.ts-out{align-self:flex-end;width:870px;box-sizing:border-box;padding:18px 24px;font-size:28px;text-align:center;background:var(--main);color:var(--ground)}
.nd[data-pair] .face{outline-color:transparent!important}
#dots [data-a="problem"][data-b="purpose"]{display:none}
</style>
</head>
<body>
<div id="view"><div id="stage"><div id="world"><svg id="links" viewBox="0 0 1920 1080"></svg></div></div></div>
<nav id="bar" aria-label="Presentation controls">
<button id="prev" aria-label="Back">Back</button>
<span id="where" aria-live="polite"></span>
<button id="next" aria-label="Next">Next</button>
<button id="ov">Overview</button>
<button id="fs">Full screen</button>
</nav>

}

const world = document.getElementById('world'), stage = document.getElementById('stage'), view = document.getElementById('view');
const order = SLIDES.map((s) => s.id);

  g.kids.forEach((id, k) => { const [x, y, w, hh] = cardRect(g.kids.length, k); PARENT[id] = g.id; SC[id] = S * w / 1920; POS[id] = [ox + (x + w / 2) * S, oy + (y + hh / 2) * S]; }); });
const tops = order.filter((id) => !PARENT[id]);
let links = '';
const lk = (a, b, c) => { let [x1,y1] = POS[a], [x2,y2] = POS[b]; if (x1 === x2) { x1 += NW * 0.3; x2 += NW * 0.3; c = false; } const d = c ? 'M'+x1+' '+y1+' Q'+(x1+x2)/2+' '+((y1+y2)/2-200)+' '+x2+' '+y2 : 'M'+x1+' '+y1+' L'+x2+' '+y2; return '<path data-a="'+a+'" data-b="'+b+'" d="'+d+'" style="fill:none;stroke-width:2"/>'; };

LINKS.forEach((l) => { links += lk(l[0], l[1], true); });
document.getElementById('links').innerHTML = links;
const nodes = SLIDES.map((s, i) => {
  const [x, y] = POS[s.id];
  const el = document.createElement('div');
  const sc = sOf(s.id), r = sc / S;
  el.className = 'nd'; if (PARENT[s.id]) el.dataset.kid = '1'; if (s.id === 'problem' || s.id === 'purpose') el.dataset.pair = '1'; el.style.cssText = 'left:' + (x - 960 * sc) + 'px;top:' + (y - 540 * sc) + 'px;width:' + 1920 * sc + 'px;height:' + 1080 * sc + 'px';
  if (PARENT[s.id]) { const [px, py] = POS[PARENT[s.id]]; el.style.transformOrigin = (px - (x - 960 * sc)) + 'px ' + (py - (y - 540 * sc)) + 'px'; }
  el.innerHTML = '<div class="face" style="transform:scale(' + sc + ');--ow:' + (PARENT[s.id] ? 7 * S / sc : 20).toFixed(1) + 'px"><div class="fin">' + build(s) + '</div></div><p class="lbl" style="font-size:' + 22 * r + 'px;top:' + 141 * r + 'px;width:' + 280 * r + 'px' + (PARENT[s.id] ? ';display:none' : '') + '">' + YB(s.name) + '</p>';
  el.addEventListener('click', () => { if (mode === 'wide') go(i, 0); });

});
function edgeDots() {

  const ctx = document.createElement('canvas').getContext('2d'); ctx.font = '22px Inter, system-ui, sans-serif';
  const boxes = (id) => { const [x, y] = POS[id], s = sOf(id), r = s / S, x0 = x - 960 * s, y0 = y - 540 * s, B = [[x0, y0, x + 960 * s, y + 540 * s]];
    return B; };
  const inside = (q, B) => B.some((b) => q.x >= b[0] && q.x <= b[2] && q.y >= b[1] && q.y <= b[3]);
  svg.querySelectorAll('path[data-a]').forEach((pa) => {
    if (!pa.dataset.full) pa.dataset.full = pa.getAttribute('d'); else pa.setAttribute('d', pa.dataset.full);
    const L = pa.getTotalLength(), A = boxes(pa.dataset.a), B = boxes(pa.dataset.b); let s = 0, e = L;

    const ps = pa.getPointAtLength(s); pa.setAttribute('d', d);
    [ps, q].forEach((pt) => { const c = document.createElementNS(NS, 'circle'); c.setAttribute('cx', pt.x); c.setAttribute('cy', pt.y); c.setAttribute('r', 6); c.setAttribute('class', 'edot'); c.dataset.a = pa.dataset.a; c.dataset.b = pa.dataset.b; dots.appendChild(c); });

    [ax + 960 * sOf(p0), bx - 960 * sOf(id)].forEach((cx) => { const c = document.createElementNS(NS, 'circle'); c.setAttribute('cx', cx); c.setAttribute('cy', ay); c.setAttribute('class', 'ndot'); c.style.transformOrigin = POS[g.id][0] + 'px ' + POS[g.id][1] + 'px'; dots.appendChild(c); }); }));

edgeDots();
try { document.fonts.ready.then(() => { edgeDots(); paint(); }); } catch (e) {}

let cur = 0, step = 0, mode = 'focus', p = 1, camNode = 0, anim = null;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
function fit() { const k = Math.min(view.clientWidth / 1920, view.clientHeight / 1080); stage.style.transform = 'scale(' + k + ') translate(-960px,-540px)'; }
function cam() {
  const sn = sOf(order[camNode]), [nx, ny] = POS[order[camNode]], z = Math.exp(p * Math.log(1 / sn)), f = (1 / z - sn) / (1 - sn);
  world.style.transform = 'translate(960px,540px) scale(' + z + ') translate(' + -(nx + (960 - nx) * f) + 'px,' + -(ny + (540 - ny) * f) + 'px)';
  stage.classList.toggle('focus', p > 0.6);
}
function tween(to, ms) { return new Promise((res) => { const from = p, t0 = performance.now(); if (reduce || !ms) { p = to; cam(); return res(); }
  const tick = (t) => { const k = Math.min(1, (t - t0) / ms), e = k < .5 ? 4*k*k*k : 1 - Math.pow(-2*k + 2, 3) / 2; p = from + (to - from) * e; cam(); if (k < 1) anim = requestAnimationFrame(tick); else res(); };
  cancelAnimationFrame(anim); anim = requestAnimationFrame(tick); }); }
function setCam(x, y, z) {
  world.style.transform = 'translate(960px,540px) scale(' + z + ') translate(' + -x + 'px,' + -y + 'px)';
  stage.classList.toggle('focus', Math.log(z) / Math.log(1 / S) > 0.6);
}
function zoomPath(ax, ay, za, bx, by, zb, ms) { return new Promise((res) => {
  const same = Math.abs(zb - za) < 1e-6, fx = same ? 0 : (zb * bx - za * ax) / (zb - za), fy = same ? 0 : (zb * by - za * ay) / (zb - za), t0 = performance.now();
  const tick = (t) => { const k = Math.min(1, (t - t0) / ms), e = 0.5 - 0.5 * Math.cos(Math.PI * k), z = Math.exp(Math.log(za) + (Math.log(zb) - Math.log(za)) * e);
    if (same) setCam(ax + (bx - ax) * e, ay + (by - ay) * e, z); else setCam(fx + (ax - fx) * za / z, fy + (ay - fy) * za / z, z);
    if (k < 1) anim = requestAnimationFrame(tick); else res(); };
  cancelAnimationFrame(anim); anim = requestAnimationFrame(tick); }); }
const pause = (ms) => new Promise((r) => setTimeout(r, ms));
let slow = 1.8;
const zoomNode = (a, b, ms) => zoomPath(POS[a][0], POS[a][1], 1 / sOf(a), POS[b][0], POS[b][1], 1 / sOf(b), ms * slow);
const glideMs = (a, b) => (950 + Math.min(650, Math.hypot(POS[b][0] - POS[a][0], POS[b][1] - POS[a][1]) * 0.6)) * slow;
function flightTime(a, b) {
  const ia = order[a], ib = order[b], ta = PARENT[ia] || ia, tb = PARENT[ib] || ib; let t = 0;
  if (ta === tb && ta !== ia && tb !== ib) return glideMs(ia, ib);
  if (ta !== ia) t += 850 * slow;
  if (ta !== tb) { if (ta !== ia || tb !== ib) t += 80; t += glideMs(ta, tb); }
  if (tb !== ib) { if (ta !== ia || ta !== tb) t += 160; t += 950 * slow; }
  if (ta === ia && tb === ib && ta === tb) t += glideMs(ia, ib);
  return t;
}
const PAIR = (x, y) => (x === 'problem' && y === 'purpose') || (x === 'purpose' && y === 'problem');
async function fly(a, b) {
  const ia = order[a], ib = order[b], ta = PARENT[ia] || ia, tb = PARENT[ib] || ib;
  if (!reduce && PAIR(ia, ib)) { await zoomPath(POS[ia][0], POS[ia][1], 1 / S, POS[ib][0], POS[ib][1], 1 / S, 650 * slow); p = 1; camNode = b; cam(); return; }
  if (!reduce && ta === tb && ta !== ia && tb !== ib) await glide(a, b);
  else if (!reduce) {
    if (ta !== ia) { await zoomNode(ia, ta, 850); }
    if (ta !== tb) { if (ta !== ia || tb !== ib) await pause(80); await glide(order.indexOf(ta), order.indexOf(tb)); }
    if (tb !== ib) { if (ta !== ia || ta !== tb) await pause(160); await zoomNode(tb, ib, 950); }
    if (ta === ia && tb === ib && ta === tb) await glide(a, b);
  }
  p = 1; camNode = b; cam();
}
function glide(a, b) { return new Promise((res) => {
  const [ax, ay] = POS[order[a]], [bx, by] = POS[order[b]], d = Math.hypot(bx - ax, by - ay);
  const sA = sOf(order[a]), sB = sOf(order[b]), lA = Math.log(1 / sA), lB = Math.log(1 / sB);
  const lM = Math.log(Math.max(1, 1920 / (d * 0.7 + 1920 * Math.max(sA, sB) * 1.25))), D = Math.max(0, Math.min(lA, lB) - lM);
  const ms = (950 + Math.min(650, d * 0.6)) * slow;

  if (reduce) return done();
  const t0 = performance.now();
  const tick = (t) => { const k = Math.min(1, (t - t0) / ms), e = 0.5 - 0.5 * Math.cos(Math.PI * k);
    setCam(ax + (bx - ax) * e, ay + (by - ay) * e, Math.exp(lA + (lB - lA) * e - D * Math.sin(Math.PI * e)));
    if (k < 1) anim = requestAnimationFrame(tick); else done(); };
  cancelAnimationFrame(anim); anim = requestAnimationFrame(tick); }); }
function paint() {
  nodes.forEach((n, i) => { n.el.className = 'nd ' + (i < cur ? 'done' : i === cur ? 'now' : 'next'); n.steps.forEach((s, k) => s.classList.toggle('on', i < cur || (i === cur && k < step))); });
  document.querySelectorAll('#links [data-a], #dots [data-a]').forEach((pa) => { const on = order.indexOf(pa.dataset.a) <= cur && order.indexOf(pa.dataset.b) <= cur; pa.style.stroke = on ? 'var(--main)' : 'var(--rule)'; if (pa.tagName === 'path') pa.style.strokeDasharray = on ? '' : '8 8'; });
  document.getElementById('where').textContent = (cur + 1) + ' of ' + order.length + ': ' + SLIDES[cur].name;
  try { history.replaceState(null, '', '#' + order[cur]); } catch (e) {}
}
let busy = false;
async function go(i, st) {
  if (busy || i < 0 || i >= order.length) return; busy = true;
  const from = cur, move = mode === 'focus' && i !== cur;
  world.style.willChange = 'transform'; stage.classList.remove('settled');
  cur = i; step = st; mode = 'focus'; paint();
  if (order[i] === 'logo') { const svg = nodes[i].el.querySelector('.logo-anim svg'); try { svg.setCurrentTime(0); svg.unpauseAnimations(); } catch (e) {} }
  const soft = move && !reduce && !PAIR(order[from], order[i]);
  let softRun = null;
  if (soft) { stage.classList.add('soft'); const t0 = performance.now(), T = flightTime(from, i) + 60;
    softRun = (t) => { const k = Math.min(1, (t - t0) / T), w = Math.pow(Math.sin(Math.PI * k), 0.7);
      stage.style.setProperty('--r', (260 * w).toFixed(1) + 'px'); stage.style.setProperty('--bw', (16 * w).toFixed(1) + 'px'); stage.style.setProperty('--cs', (1 - 0.09 * w).toFixed(4));
      if (k < 1 && softRun) requestAnimationFrame(softRun); };
    requestAnimationFrame(softRun); }

  if (soft) { await pause(60); softRun = null; stage.classList.remove('soft'); stage.style.removeProperty('--r'); stage.style.removeProperty('--bw'); stage.style.removeProperty('--cs'); }
  stage.classList.toggle('onkid', !!PARENT[order[i]]); stage.classList.add('settled');
  world.style.willChange = 'auto'; busy = false;
}
const maxSteps = (i) => nodes[i].steps.length + (SLIDES[i].kind === 'hook' ? 1 : 0);
function next() { if (busy) return; if (mode === 'wide') return go(cur, step); if (step < maxSteps(cur)) { step++; paint(); } else go(cur + 1, 0); }
function prev() { if (busy) return; if (mode === 'wide') return go(cur, step); if (step > 0) { step--; paint(); } else if (cur > 0) go(cur - 1, maxSteps(cur - 1)); }

document.getElementById('next').onclick = next; document.getElementById('prev').onclick = prev; document.getElementById('ov').onclick = overview;
document.getElementById('fs').onclick = () => { try { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); } catch (e) {} };
addEventListener('keydown', (e) => {
  if (['ArrowRight','PageDown',' ','Enter'].includes(e.key)) { e.preventDefault(); next(); }
  else if (['ArrowLeft','PageUp','Backspace'].includes(e.key)) { e.preventDefault(); prev(); }
  else if (e.key === 'o' || e.key === 'O' || e.key === 'Escape') overview();
  else if (e.key === 'f' || e.key === 'F') document.getElementById('fs').click();
  else if (e.key === 'Home') go(0, 0);
});
view.addEventListener('click', (e) => { if (mode === 'focus' && !e.target.closest('#bar')) next(); });
let idle; const bar = document.getElementById('bar'); addEventListener('mousemove', () => { bar.classList.remove('idle'); clearTimeout(idle); idle = setTimeout(() => bar.classList.add('idle'), 2500); });
addEventListener('resize', fit);
const start = Math.max(0, order.indexOf(location.hash.slice(1)));
cur = start; camNode = start; fit(); paint(); cam();
if (order[start] === 'logo') { try { nodes[start].el.querySelector('.logo-anim svg').setCurrentTime(0); } catch (e) {} }
