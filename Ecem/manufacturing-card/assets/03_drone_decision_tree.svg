<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920"><rect width="1600" height="920" fill="#F3F4F1"/><text x="80" y="96.0" font-family="DejaVu Sans Mono, monospace" font-size="20" font-weight="500" fill="#2F5D8A" text-anchor="start" letter-spacing="2">FABRICATION METHOD DECISION</text><text x="80" y="150.0" font-family="Inter Display, Inter, Helvetica, Arial, sans-serif" font-size="48" font-weight="700" fill="#14181F" text-anchor="start" letter-spacing="0">Do we need a drone?</text><rect x="80" y="250" width="1440" height="90" rx="14" fill="#14181F" stroke="#14181F" stroke-width="2"/><text x="800" y="307.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="30" font-weight="600" fill="#F3F4F1" text-anchor="middle" letter-spacing="0">Could a ground machine reach and fit around the whole build?</text><text x="80" y="400.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="500" fill="#4F5864" text-anchor="start" letter-spacing="0">Use drones only if at least one is true:</text><rect x="80" y="430" width="335" height="190" rx="14" fill="#FFFFFF" stroke="#D3D8D0" stroke-width="2"/><text x="108" y="480.0" font-family="Inter Display, Inter, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#2F5D8A" text-anchor="start" letter-spacing="0">Size</text><text x="108" y="522.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#4F5864" text-anchor="start" letter-spacing="0">Bigger than any machine</text><text x="108" y="552.8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#4F5864" text-anchor="start" letter-spacing="0">you could put around it</text><rect x="445" y="430" width="335" height="190" rx="14" fill="#FFFFFF" stroke="#D3D8D0" stroke-width="2"/><text x="473" y="480.0" font-family="Inter Display, Inter, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#2F5D8A" text-anchor="start" letter-spacing="0">Access</text><text x="473" y="522.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#4F5864" text-anchor="start" letter-spacing="0">At height, remote, post-</text><text x="473" y="552.8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#4F5864" text-anchor="start" letter-spacing="0">disaster or a repair in</text><text x="473" y="583.6" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#4F5864" text-anchor="start" letter-spacing="0">place</text><rect x="810" y="430" width="335" height="190" rx="14" fill="#FFFFFF" stroke="#D3D8D0" stroke-width="2"/><text x="838" y="480.0" font-family="Inter Display, Inter, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#2F5D8A" text-anchor="start" letter-spacing="0">Congestion</text><text x="838" y="522.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#4F5864" text-anchor="start" letter-spacing="0">Ground robots would block</text><text x="838" y="552.8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#4F5864" text-anchor="start" letter-spacing="0">each other as the build</text><text x="838" y="583.6" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#4F5864" text-anchor="start" letter-spacing="0">grows</text><rect x="1175" y="430" width="335" height="190" rx="14" fill="#FFFFFF" stroke="#D3D8D0" stroke-width="2"/><text x="1203" y="480.0" font-family="Inter Display, Inter, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#2F5D8A" text-anchor="start" letter-spacing="0">Scaffolding</text><text x="1203" y="522.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#4F5864" text-anchor="start" letter-spacing="0">The form would need</text><text x="1203" y="552.8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#4F5864" text-anchor="start" letter-spacing="0">scaffolding that grows</text><text x="1203" y="583.6" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#4F5864" text-anchor="start" letter-spacing="0">with its span</text><rect x="80" y="670" width="700" height="150" rx="14" fill="#E3ECF6" stroke="#B9CDE4" stroke-width="2"/><text x="110" y="725.0" font-family="Inter Display, Inter, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#2F5D8A" text-anchor="start" letter-spacing="0">Yes to any → aerial AM</text><text x="110" y="770.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#14181F" text-anchor="start" letter-spacing="0">Plan for many small trips, light materials and stage</text><text x="110" y="798.6" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#14181F" text-anchor="start" letter-spacing="0">checks.</text><rect x="820" y="670" width="700" height="150" rx="14" fill="#FBF1E4" stroke="#E8C9A2" stroke-width="2"/><text x="850" y="725.0" font-family="Inter Display, Inter, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#B8661A" text-anchor="start" letter-spacing="0">No to all → a ground method</text><text x="850" y="770.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#14181F" text-anchor="start" letter-spacing="0">Gantry, robot arm or mobile printer: faster, stronger,</text><text x="850" y="798.6" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#14181F" text-anchor="start" letter-spacing="0">more accurate.</text></svg>