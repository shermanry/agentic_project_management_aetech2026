<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920"><rect width="1600" height="920" fill="#F3F4F1"/><text x="80" y="96.0" font-family="DejaVu Sans Mono, monospace" font-size="20" font-weight="500" fill="#2F5D8A" text-anchor="start" letter-spacing="2">DECISIONS TO TRACK</text><text x="80" y="150.0" font-family="Inter Display, Inter, Helvetica, Arial, sans-serif" font-size="48" font-weight="700" fill="#14181F" text-anchor="start" letter-spacing="0">Project manager: what the PM decides</text><g transform="translate(1480,70) scale(1.8333333333333333)" fill="none" stroke="#7A4FB5" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1"/><path d="M9 10h6M9 14h6M9 18h3"/></g><rect x="80" y="250" width="700" height="140" rx="14" fill="#FFFFFF" stroke="#D3D8D0" stroke-width="2"/><rect x="80" y="250" width="8" height="140" rx="4" fill="#7A4FB5"/><text x="112" y="294.0" font-family="DejaVu Sans Mono, monospace" font-size="16" font-weight="500" fill="#7A4FB5" text-anchor="start" letter-spacing="0">PM01</text><text x="190" y="294.0" font-family="Inter Display, Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#14181F" text-anchor="start" letter-spacing="0">Budget</text><text x="112" y="334.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4F5864" text-anchor="start" letter-spacing="0">Trips × (material + battery cycles + crew time). 72 trips for</text><text x="112" y="362.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4F5864" text-anchor="start" letter-spacing="0">the 2.05 m tower.</text><rect x="810" y="250" width="700" height="140" rx="14" fill="#FFFFFF" stroke="#D3D8D0" stroke-width="2"/><rect x="810" y="250" width="8" height="140" rx="4" fill="#7A4FB5"/><text x="842" y="294.0" font-family="DejaVu Sans Mono, monospace" font-size="16" font-weight="500" fill="#7A4FB5" text-anchor="start" letter-spacing="0">PM02</text><text x="920" y="294.0" font-family="Inter Display, Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#14181F" text-anchor="start" letter-spacing="0">Schedule and weather windows</text><text x="842" y="334.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4F5864" text-anchor="start" letter-spacing="0">Layers × (deposit + refill + scan + cure), inside forecast</text><text x="842" y="362.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4F5864" text-anchor="start" letter-spacing="0">windows, plus buffer.</text><rect x="80" y="410" width="700" height="140" rx="14" fill="#FFFFFF" stroke="#D3D8D0" stroke-width="2"/><rect x="80" y="410" width="8" height="140" rx="4" fill="#7A4FB5"/><text x="112" y="454.0" font-family="DejaVu Sans Mono, monospace" font-size="16" font-weight="500" fill="#7A4FB5" text-anchor="start" letter-spacing="0">PM03</text><text x="190" y="454.0" font-family="Inter Display, Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#14181F" text-anchor="start" letter-spacing="0">Which risks to accept</text><text x="112" y="494.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4F5864" text-anchor="start" letter-spacing="0">Accept what a loop corrects, mitigate what redundancy covers,</text><text x="112" y="522.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4F5864" text-anchor="start" letter-spacing="0">avoid what no test covers.</text><rect x="810" y="410" width="700" height="140" rx="14" fill="#FFFFFF" stroke="#D3D8D0" stroke-width="2"/><rect x="810" y="410" width="8" height="140" rx="4" fill="#7A4FB5"/><text x="842" y="454.0" font-family="DejaVu Sans Mono, monospace" font-size="16" font-weight="500" fill="#7A4FB5" text-anchor="start" letter-spacing="0">PM04</text><text x="920" y="454.0" font-family="Inter Display, Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#14181F" text-anchor="start" letter-spacing="0">Scope changes</text><text x="842" y="494.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4F5864" text-anchor="start" letter-spacing="0">Before freeze: buildability check. After: twin stability check</text><text x="842" y="522.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4F5864" text-anchor="start" letter-spacing="0">and a new version.</text><rect x="80" y="570" width="700" height="140" rx="14" fill="#FFFFFF" stroke="#D3D8D0" stroke-width="2"/><rect x="80" y="570" width="8" height="140" rx="4" fill="#7A4FB5"/><text x="112" y="614.0" font-family="DejaVu Sans Mono, monospace" font-size="16" font-weight="500" fill="#7A4FB5" text-anchor="start" letter-spacing="0">PM05</text><text x="190" y="614.0" font-family="Inter Display, Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#14181F" text-anchor="start" letter-spacing="0">Staffing</text><text x="112" y="654.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4F5864" text-anchor="start" letter-spacing="0">One supervisor plus a refill and battery crew per shift, until</text><text x="112" y="682.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4F5864" text-anchor="start" letter-spacing="0">refilling is automated.</text><rect x="810" y="570" width="700" height="140" rx="14" fill="#FFFFFF" stroke="#D3D8D0" stroke-width="2"/><rect x="810" y="570" width="8" height="140" rx="4" fill="#7A4FB5"/><text x="842" y="614.0" font-family="DejaVu Sans Mono, monospace" font-size="16" font-weight="500" fill="#7A4FB5" text-anchor="start" letter-spacing="0">PM06</text><text x="920" y="614.0" font-family="Inter Display, Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#14181F" text-anchor="start" letter-spacing="0">Permits and airspace</text><text x="842" y="654.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4F5864" text-anchor="start" letter-spacing="0">Check local aviation rules for multi-drone flights and code</text><text x="842" y="682.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4F5864" text-anchor="start" letter-spacing="0">acceptance before outdoors.</text><rect x="80" y="730" width="700" height="140" rx="14" fill="#FFFFFF" stroke="#D3D8D0" stroke-width="2"/><rect x="80" y="730" width="8" height="140" rx="4" fill="#7A4FB5"/><text x="112" y="774.0" font-family="DejaVu Sans Mono, monospace" font-size="16" font-weight="500" fill="#7A4FB5" text-anchor="start" letter-spacing="0">PM07</text><text x="190" y="774.0" font-family="Inter Display, Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#14181F" text-anchor="start" letter-spacing="0">Material supply</text><text x="112" y="814.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4F5864" text-anchor="start" letter-spacing="0">Mixes stay workable briefly: source near site, mix on site where</text><text x="112" y="842.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4F5864" text-anchor="start" letter-spacing="0">possible.</text><rect x="810" y="730" width="700" height="140" rx="14" fill="#FFFFFF" stroke="#D3D8D0" stroke-width="2"/><rect x="810" y="730" width="8" height="140" rx="4" fill="#7A4FB5"/><text x="842" y="774.0" font-family="DejaVu Sans Mono, monospace" font-size="16" font-weight="500" fill="#7A4FB5" text-anchor="start" letter-spacing="0">PM08</text><text x="920" y="774.0" font-family="Inter Display, Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#14181F" text-anchor="start" letter-spacing="0">Stakeholder sign-off</text><text x="842" y="814.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4F5864" text-anchor="start" letter-spacing="0">At design gates, a safety gate before outdoor flights, and</text><text x="842" y="842.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4F5864" text-anchor="start" letter-spacing="0">handover.</text></svg>