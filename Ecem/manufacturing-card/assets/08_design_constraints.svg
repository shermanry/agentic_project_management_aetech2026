<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960"><rect width="1600" height="960" fill="#F3F4F1"/><text x="80" y="96.0" font-family="DejaVu Sans Mono, monospace" font-size="20" font-weight="500" fill="#2F5D8A" text-anchor="start" letter-spacing="2">DESIGN CONSTRAINTS</text><text x="80" y="150.0" font-family="Inter Display, Inter, Helvetica, Arial, sans-serif" font-size="48" font-weight="700" fill="#14181F" text-anchor="start" letter-spacing="0">What a design must respect to be built by drones</text><rect x="80" y="250" width="335" height="290" rx="14" fill="#FFFFFF" stroke="#D3D8D0" stroke-width="2"/><text x="108" y="314.0" font-family="Inter Display, Inter, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#2F5D8A" text-anchor="start" letter-spacing="0">6 mm layers</text><text x="108" y="370.0" font-family="Inter Display, Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#14181F" text-anchor="start" letter-spacing="0">Geometry</text><text x="108" y="410.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4F5864" text-anchor="start" letter-spacing="0">Horizontal layers, thin</text><text x="108" y="439.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4F5864" text-anchor="start" letter-spacing="0">single walls, no unsupported</text><text x="108" y="468.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4F5864" text-anchor="start" letter-spacing="0">overhangs</text><rect x="445" y="250" width="335" height="290" rx="14" fill="#FFFFFF" stroke="#D3D8D0" stroke-width="2"/><text x="473" y="314.0" font-family="Inter Display, Inter, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#2F5D8A" text-anchor="start" letter-spacing="0">CAAM</text><text x="473" y="370.0" font-family="Inter Display, Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#14181F" text-anchor="start" letter-spacing="0">Stage stability</text><text x="473" y="410.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4F5864" text-anchor="start" letter-spacing="0">Every interim state must</text><text x="473" y="439.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4F5864" text-anchor="start" letter-spacing="0">stand, not only the final</text><text x="473" y="468.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4F5864" text-anchor="start" letter-spacing="0">form</text><rect x="810" y="250" width="335" height="290" rx="14" fill="#FFFFFF" stroke="#D3D8D0" stroke-width="2"/><text x="838" y="314.0" font-family="Inter Display, Inter, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#2F5D8A" text-anchor="start" letter-spacing="0">30 kg/m³ foam</text><text x="838" y="370.0" font-family="Inter Display, Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#14181F" text-anchor="start" letter-spacing="0">Material</text><text x="838" y="410.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4F5864" text-anchor="start" letter-spacing="0">Carryable, flows, holds</text><text x="838" y="439.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4F5864" text-anchor="start" letter-spacing="0">shape, doesn't set in the</text><text x="838" y="468.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4F5864" text-anchor="start" letter-spacing="0">nozzle</text><rect x="1175" y="250" width="335" height="290" rx="14" fill="#FFFFFF" stroke="#D3D8D0" stroke-width="2"/><text x="1203" y="314.0" font-family="Inter Display, Inter, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#2F5D8A" text-anchor="start" letter-spacing="0">202 mL</text><text x="1203" y="370.0" font-family="Inter Display, Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#14181F" text-anchor="start" letter-spacing="0">Payload</text><text x="1203" y="410.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4F5864" text-anchor="start" letter-spacing="0">About one layer per trip</text><rect x="80" y="570" width="335" height="290" rx="14" fill="#FFFFFF" stroke="#D3D8D0" stroke-width="2"/><text x="108" y="634.0" font-family="Inter Display, Inter, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#2F5D8A" text-anchor="start" letter-spacing="0">≤5 mm</text><text x="108" y="690.0" font-family="Inter Display, Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#14181F" text-anchor="start" letter-spacing="0">Tolerance</text><text x="108" y="730.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4F5864" text-anchor="start" letter-spacing="0">About 5 mm with a</text><text x="108" y="759.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4F5864" text-anchor="start" letter-spacing="0">stabilising arm</text><rect x="445" y="570" width="335" height="290" rx="14" fill="#FFFFFF" stroke="#D3D8D0" stroke-width="2"/><text x="473" y="634.0" font-family="Inter Display, Inter, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#2F5D8A" text-anchor="start" letter-spacing="0">1 cm/s</text><text x="473" y="690.0" font-family="Inter Display, Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#14181F" text-anchor="start" letter-spacing="0">Throughput</text><text x="473" y="730.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4F5864" text-anchor="start" letter-spacing="0">Slow deposition; fewer</text><text x="473" y="759.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4F5864" text-anchor="start" letter-spacing="0">robots as contours shrink</text><rect x="810" y="570" width="335" height="290" rx="14" fill="#FFFFFF" stroke="#D3D8D0" stroke-width="2"/><text x="838" y="634.0" font-family="Inter Display, Inter, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#2F5D8A" text-anchor="start" letter-spacing="0">Indoor only</text><text x="838" y="690.0" font-family="Inter Display, Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#14181F" text-anchor="start" letter-spacing="0">Environment</text><text x="838" y="730.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4F5864" text-anchor="start" letter-spacing="0">Downwash, wind, temperature</text><text x="838" y="759.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4F5864" text-anchor="start" letter-spacing="0">on curing</text><rect x="1175" y="570" width="335" height="290" rx="14" fill="#FFFFFF" stroke="#D3D8D0" stroke-width="2"/><text x="1203" y="634.0" font-family="Inter Display, Inter, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#2F5D8A" text-anchor="start" letter-spacing="0">~25 MPa target</text><text x="1203" y="690.0" font-family="Inter Display, Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#14181F" text-anchor="start" letter-spacing="0">Structure</text><text x="1203" y="730.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4F5864" text-anchor="start" letter-spacing="0">Not load-bearing yet;</text><text x="1203" y="759.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4F5864" text-anchor="start" letter-spacing="0">reinforcement unsolved</text><text x="80" y="916.0" font-family="DejaVu Sans Mono, monospace" font-size="16" font-weight="400" fill="#4F5864" text-anchor="start" letter-spacing="0">Zhang et al., Nature 2022 · Stuart-Smith et al., CAAM · Frontiers in Materials review 2024</text></svg>