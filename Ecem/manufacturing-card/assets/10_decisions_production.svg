<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920"><rect width="1600" height="920" fill="#F3F4F1"/><text x="80" y="96.0" font-family="DejaVu Sans Mono, monospace" font-size="20" font-weight="500" fill="#2F5D8A" text-anchor="start" letter-spacing="2">DECISIONS TO TRACK</text><text x="80" y="150.0" font-family="Inter Display, Inter, Helvetica, Arial, sans-serif" font-size="48" font-weight="700" fill="#14181F" text-anchor="start" letter-spacing="0">Production: what designer and site decide</text><g transform="translate(1480,70) scale(1.8333333333333333)" fill="none" stroke="#0F7B6C" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/></g><rect x="80" y="250" width="700" height="140" rx="14" fill="#FFFFFF" stroke="#D3D8D0" stroke-width="2"/><rect x="80" y="250" width="8" height="140" rx="4" fill="#0F7B6C"/><text x="112" y="294.0" font-family="DejaVu Sans Mono, monospace" font-size="16" font-weight="500" fill="#0F7B6C" text-anchor="start" letter-spacing="0">PD01</text><text x="190" y="294.0" font-family="Inter Display, Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#14181F" text-anchor="start" letter-spacing="0">Release the next layer?</text><text x="112" y="334.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4F5864" text-anchor="start" letter-spacing="0">Go when deviation, cure, stability, weather, material and</text><text x="112" y="362.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4F5864" text-anchor="start" letter-spacing="0">battery all pass. Else adjust or hold.</text><rect x="810" y="250" width="700" height="140" rx="14" fill="#FFFFFF" stroke="#D3D8D0" stroke-width="2"/><rect x="810" y="250" width="8" height="140" rx="4" fill="#0F7B6C"/><text x="842" y="294.0" font-family="DejaVu Sans Mono, monospace" font-size="16" font-weight="500" fill="#0F7B6C" text-anchor="start" letter-spacing="0">PD02</text><text x="920" y="294.0" font-family="Inter Display, Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#14181F" text-anchor="start" letter-spacing="0">Accept the deviation, or correct?</text><text x="842" y="334.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4F5864" text-anchor="start" letter-spacing="0">Correct the next layer by offsetting its path. Stop if the same</text><text x="842" y="362.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4F5864" text-anchor="start" letter-spacing="0">error repeats.</text><rect x="80" y="410" width="700" height="140" rx="14" fill="#FFFFFF" stroke="#D3D8D0" stroke-width="2"/><rect x="80" y="410" width="8" height="140" rx="4" fill="#0F7B6C"/><text x="112" y="454.0" font-family="DejaVu Sans Mono, monospace" font-size="16" font-weight="500" fill="#0F7B6C" text-anchor="start" letter-spacing="0">PD03</text><text x="190" y="454.0" font-family="Inter Display, Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#14181F" text-anchor="start" letter-spacing="0">Redesign to match what was built?</text><text x="112" y="494.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4F5864" text-anchor="start" letter-spacing="0">Small drift: offsets absorb it. Large drift: revise upper</text><text x="112" y="522.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4F5864" text-anchor="start" letter-spacing="0">layers, check on the twin, log it.</text><rect x="810" y="410" width="700" height="140" rx="14" fill="#FFFFFF" stroke="#D3D8D0" stroke-width="2"/><rect x="810" y="410" width="8" height="140" rx="4" fill="#0F7B6C"/><text x="842" y="454.0" font-family="DejaVu Sans Mono, monospace" font-size="16" font-weight="500" fill="#0F7B6C" text-anchor="start" letter-spacing="0">PD04</text><text x="920" y="454.0" font-family="Inter Display, Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#14181F" text-anchor="start" letter-spacing="0">How many robots this layer?</text><text x="842" y="494.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4F5864" text-anchor="start" letter-spacing="0">Size to the contour; retire robots as it shrinks. Keep two so</text><text x="842" y="522.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4F5864" text-anchor="start" letter-spacing="0">one prints, one refills.</text><rect x="80" y="570" width="700" height="140" rx="14" fill="#FFFFFF" stroke="#D3D8D0" stroke-width="2"/><rect x="80" y="570" width="8" height="140" rx="4" fill="#0F7B6C"/><text x="112" y="614.0" font-family="DejaVu Sans Mono, monospace" font-size="16" font-weight="500" fill="#0F7B6C" text-anchor="start" letter-spacing="0">PD05</text><text x="190" y="614.0" font-family="Inter Display, Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#14181F" text-anchor="start" letter-spacing="0">Pause for weather?</text><text x="112" y="654.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4F5864" text-anchor="start" letter-spacing="0">Unknown yet: all tests were indoors. Set wind and temperature</text><text x="112" y="682.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4F5864" text-anchor="start" letter-spacing="0">limits in a pilot.</text><rect x="810" y="570" width="700" height="140" rx="14" fill="#FFFFFF" stroke="#D3D8D0" stroke-width="2"/><rect x="810" y="570" width="8" height="140" rx="4" fill="#0F7B6C"/><text x="842" y="614.0" font-family="DejaVu Sans Mono, monospace" font-size="16" font-weight="500" fill="#0F7B6C" text-anchor="start" letter-spacing="0">PD06</text><text x="920" y="614.0" font-family="Inter Display, Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#14181F" text-anchor="start" letter-spacing="0">When to refill?</text><text x="842" y="654.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4F5864" text-anchor="start" letter-spacing="0">After every layer. One 202 mL cartridge is about one layer. Stay</text><text x="842" y="682.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4F5864" text-anchor="start" letter-spacing="0">inside the open time.</text><rect x="80" y="730" width="700" height="140" rx="14" fill="#FFFFFF" stroke="#D3D8D0" stroke-width="2"/><rect x="80" y="730" width="8" height="140" rx="4" fill="#0F7B6C"/><text x="112" y="774.0" font-family="DejaVu Sans Mono, monospace" font-size="16" font-weight="500" fill="#0F7B6C" text-anchor="start" letter-spacing="0">PD07</text><text x="190" y="774.0" font-family="Inter Display, Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#14181F" text-anchor="start" letter-spacing="0">A robot fails: reassign or stop?</text><text x="112" y="814.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4F5864" text-anchor="start" letter-spacing="0">Reassign if the rest can finish before the mix sets. Otherwise</text><text x="112" y="842.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4F5864" text-anchor="start" letter-spacing="0">stop at a layer boundary.</text><rect x="810" y="730" width="700" height="140" rx="14" fill="#FFFFFF" stroke="#D3D8D0" stroke-width="2"/><rect x="810" y="730" width="8" height="140" rx="4" fill="#0F7B6C"/><text x="842" y="774.0" font-family="DejaVu Sans Mono, monospace" font-size="16" font-weight="500" fill="#0F7B6C" text-anchor="start" letter-spacing="0">PD08</text><text x="920" y="774.0" font-family="Inter Display, Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#14181F" text-anchor="start" letter-spacing="0">Accept the finished build?</text><text x="842" y="814.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4F5864" text-anchor="start" letter-spacing="0">When a laser scan matches the design within tolerance. Foam</text><text x="842" y="842.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4F5864" text-anchor="start" letter-spacing="0">tower: 2.27 cm median.</text></svg>