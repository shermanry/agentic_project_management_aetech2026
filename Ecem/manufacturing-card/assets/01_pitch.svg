<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#14181F"/><text x="80" y="120.0" font-family="DejaVu Sans Mono, monospace" font-size="22" font-weight="500" fill="#F0B46A" text-anchor="start" letter-spacing="2">WHY DRONES</text><text x="80" y="250.0" font-family="Inter Display, Inter, Helvetica, Arial, sans-serif" font-size="72" font-weight="700" fill="#F3F4F1" text-anchor="start" letter-spacing="0">Drones turn construction from a</text><text x="80" y="329.2" font-family="Inter Display, Inter, Helvetica, Arial, sans-serif" font-size="72" font-weight="700" fill="#F3F4F1" text-anchor="start" letter-spacing="0">machine you bring to the site into a</text><text x="80" y="408.4" font-family="Inter Display, Inter, Helvetica, Arial, sans-serif" font-size="72" font-weight="700" fill="#F3F4F1" text-anchor="start" letter-spacing="0">crew that moves through it.</text><text x="80" y="527.6" font-family="Inter, Helvetica, Arial, sans-serif" font-size="30" font-weight="400" fill="#C4CAD2" text-anchor="start" letter-spacing="0">They build bigger than themselves and reach where cranes and people can't. That</text><text x="80" y="569.6" font-family="Inter, Helvetica, Arial, sans-serif" font-size="30" font-weight="400" fill="#C4CAD2" text-anchor="start" letter-spacing="0">freedom brings flexibility to design and production, and more data that has to be</text><text x="80" y="611.6" font-family="Inter, Helvetica, Arial, sans-serif" font-size="30" font-weight="400" fill="#C4CAD2" text-anchor="start" letter-spacing="0">controlled.</text><text x="80" y="856.0" font-family="DejaVu Sans Mono, monospace" font-size="16" font-weight="400" fill="#9AA3AD" text-anchor="start" letter-spacing="0">Aerial AM case study</text></svg>