<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920"><rect width="1600" height="920" fill="#F3F4F1"/><text x="80" y="96.0" font-family="DejaVu Sans Mono, monospace" font-size="20" font-weight="500" fill="#2F5D8A" text-anchor="start" letter-spacing="2">DECISIONS TO TRACK</text><text x="80" y="150.0" font-family="Inter Display, Inter, Helvetica, Arial, sans-serif" font-size="48" font-weight="700" fill="#14181F" text-anchor="start" letter-spacing="0">Design phase: what the designer decides</text><g transform="translate(1480,70) scale(1.8333333333333333)" fill="none" stroke="#2F5D8A" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21l3.5-1 11-11-2.5-2.5-11 11L3 21z"/><path d="M14 6l2.5 2.5"/><path d="M15 4l1.5-1.5 2.5 2.5L17.5 6.5"/></g><rect x="80" y="250" width="700" height="140" rx="14" fill="#FFFFFF" stroke="#D3D8D0" stroke-width="2"/><rect x="80" y="250" width="8" height="140" rx="4" fill="#2F5D8A"/><text x="112" y="294.0" font-family="DejaVu Sans Mono, monospace" font-size="16" font-weight="500" fill="#2F5D8A" text-anchor="start" letter-spacing="0">DD01</text><text x="190" y="294.0" font-family="Inter Display, Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#14181F" text-anchor="start" letter-spacing="0">Is a drone even needed?</text><text x="112" y="334.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4F5864" text-anchor="start" letter-spacing="0">Only if size, access, congestion or scaffolding demands it.</text><text x="112" y="362.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4F5864" text-anchor="start" letter-spacing="0">Otherwise a ground method.</text><rect x="810" y="250" width="700" height="140" rx="14" fill="#FFFFFF" stroke="#D3D8D0" stroke-width="2"/><rect x="810" y="250" width="8" height="140" rx="4" fill="#2F5D8A"/><text x="842" y="294.0" font-family="DejaVu Sans Mono, monospace" font-size="16" font-weight="500" fill="#2F5D8A" text-anchor="start" letter-spacing="0">DD02</text><text x="920" y="294.0" font-family="Inter Display, Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#14181F" text-anchor="start" letter-spacing="0">Does the form fit the method?</text><text x="842" y="334.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4F5864" text-anchor="start" letter-spacing="0">Horizontal layers, thin single walls, no unsupported overhangs.</text><text x="842" y="362.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4F5864" text-anchor="start" letter-spacing="0">Only cylinders were printed.</text><rect x="80" y="410" width="700" height="140" rx="14" fill="#FFFFFF" stroke="#D3D8D0" stroke-width="2"/><rect x="80" y="410" width="8" height="140" rx="4" fill="#2F5D8A"/><text x="112" y="454.0" font-family="DejaVu Sans Mono, monospace" font-size="16" font-weight="500" fill="#2F5D8A" text-anchor="start" letter-spacing="0">DD03</text><text x="190" y="454.0" font-family="Inter Display, Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#14181F" text-anchor="start" letter-spacing="0">Strength, weight or curing time?</text><text x="112" y="494.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4F5864" text-anchor="start" letter-spacing="0">Foam for form studies and insulation; cement (~25 MPa target)</text><text x="112" y="522.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4F5864" text-anchor="start" letter-spacing="0">for thin shells.</text><rect x="810" y="410" width="700" height="140" rx="14" fill="#FFFFFF" stroke="#D3D8D0" stroke-width="2"/><rect x="810" y="410" width="8" height="140" rx="4" fill="#2F5D8A"/><text x="842" y="454.0" font-family="DejaVu Sans Mono, monospace" font-size="16" font-weight="500" fill="#2F5D8A" text-anchor="start" letter-spacing="0">DD04</text><text x="920" y="454.0" font-family="Inter Display, Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#14181F" text-anchor="start" letter-spacing="0">How much deviation is acceptable?</text><text x="842" y="494.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4F5864" text-anchor="start" letter-spacing="0">≤5 mm for cement with the delta arm; about 2–3 cm for foam.</text><rect x="80" y="570" width="700" height="140" rx="14" fill="#FFFFFF" stroke="#D3D8D0" stroke-width="2"/><rect x="80" y="570" width="8" height="140" rx="4" fill="#2F5D8A"/><text x="112" y="614.0" font-family="DejaVu Sans Mono, monospace" font-size="16" font-weight="500" fill="#2F5D8A" text-anchor="start" letter-spacing="0">DD05</text><text x="190" y="614.0" font-family="Inter Display, Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#14181F" text-anchor="start" letter-spacing="0">Fewer trips, or a better finish?</text><text x="112" y="654.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4F5864" text-anchor="start" letter-spacing="0">Fewer trips. Peano is shortest: 5.85 m per two layers vs 7.61 m</text><text x="112" y="682.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4F5864" text-anchor="start" letter-spacing="0">concentric.</text><rect x="810" y="570" width="700" height="140" rx="14" fill="#FFFFFF" stroke="#D3D8D0" stroke-width="2"/><rect x="810" y="570" width="8" height="140" rx="4" fill="#2F5D8A"/><text x="842" y="614.0" font-family="DejaVu Sans Mono, monospace" font-size="16" font-weight="500" fill="#2F5D8A" text-anchor="start" letter-spacing="0">DD06</text><text x="920" y="614.0" font-family="Inter Display, Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#14181F" text-anchor="start" letter-spacing="0">Redesign, or add scaffolding?</text><text x="842" y="654.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4F5864" text-anchor="start" letter-spacing="0">Redesign or re-sequence first, checked on a digital twin.</text><text x="842" y="682.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4F5864" text-anchor="start" letter-spacing="0">Scaffold only where checks fail.</text><rect x="80" y="730" width="700" height="140" rx="14" fill="#FFFFFF" stroke="#D3D8D0" stroke-width="2"/><rect x="80" y="730" width="8" height="140" rx="4" fill="#2F5D8A"/><text x="112" y="774.0" font-family="DejaVu Sans Mono, monospace" font-size="16" font-weight="500" fill="#2F5D8A" text-anchor="start" letter-spacing="0">DD07</text><text x="190" y="774.0" font-family="Inter Display, Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#14181F" text-anchor="start" letter-spacing="0">What structural role?</text><text x="112" y="814.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4F5864" text-anchor="start" letter-spacing="0">Enclosure, formwork, insulation or repair. Not load-bearing</text><text x="112" y="842.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4F5864" text-anchor="start" letter-spacing="0">until reinforcement is solved.</text><rect x="810" y="730" width="700" height="140" rx="14" fill="#FFFFFF" stroke="#D3D8D0" stroke-width="2"/><rect x="810" y="730" width="8" height="140" rx="4" fill="#2F5D8A"/><text x="842" y="774.0" font-family="DejaVu Sans Mono, monospace" font-size="16" font-weight="500" fill="#2F5D8A" text-anchor="start" letter-spacing="0">DD08</text><text x="920" y="774.0" font-family="Inter Display, Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#14181F" text-anchor="start" letter-spacing="0">What can change once building starts?</text><text x="842" y="814.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4F5864" text-anchor="start" letter-spacing="0">Freeze footprint, material, tolerance and role. Keep upper</text><text x="842" y="842.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4F5864" text-anchor="start" letter-spacing="0">geometry and sequence open.</text></svg>