<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920"><rect width="1600" height="920" fill="#F3F4F1"/><text x="80" y="96.0" font-family="DejaVu Sans Mono, monospace" font-size="20" font-weight="500" fill="#2F5D8A" text-anchor="start" letter-spacing="2">WHAT DRONES ADD OVER OTHER ROBOTS</text><text x="80" y="150.0" font-family="Inter Display, Inter, Helvetica, Arial, sans-serif" font-size="48" font-weight="700" fill="#14181F" text-anchor="start" letter-spacing="0">Six things a ground machine can't give you</text><rect x="80" y="250" width="450" height="270" rx="14" fill="#FFFFFF" stroke="#D3D8D0" stroke-width="2"/><g transform="translate(112,282) scale(1.6666666666666667)" fill="none" stroke="#2F5D8A" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="6" r="2.5"/><circle cx="19" cy="6" r="2.5"/><circle cx="5" cy="18" r="2.5"/><circle cx="19" cy="18" r="2.5"/><rect x="9" y="9" width="6" height="6" rx="1.5"/><path d="M7 8l2 2M17 8l-2 2M7 16l2-2M17 16l-2-2"/></g><text x="112" y="370.0" font-family="Inter Display, Inter, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#14181F" text-anchor="start" letter-spacing="0">No fixed work area</text><text x="112" y="406.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#4F5864" text-anchor="start" letter-spacing="0">A team builds larger than any one</text><text x="112" y="435.7" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#4F5864" text-anchor="start" letter-spacing="0">robot. No frame or arm reach to</text><text x="112" y="465.4" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#4F5864" text-anchor="start" letter-spacing="0">design inside.</text><text x="112" y="500.0" font-family="DejaVu Sans Mono, monospace" font-size="18" font-weight="500" fill="#2F5D8A" text-anchor="start" letter-spacing="0">CAAM</text><rect x="570" y="250" width="450" height="270" rx="14" fill="#FFFFFF" stroke="#D3D8D0" stroke-width="2"/><g transform="translate(602,282) scale(1.6666666666666667)" fill="none" stroke="#2F5D8A" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h13"/><path d="M13 7l5 5-5 5"/></g><text x="602" y="370.0" font-family="Inter Display, Inter, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#14181F" text-anchor="start" letter-spacing="0">Free circulation</text><text x="602" y="406.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#4F5864" text-anchor="start" letter-spacing="0">Robots fly above the site instead</text><text x="602" y="435.7" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#4F5864" text-anchor="start" letter-spacing="0">of competing for congested ground.</text><text x="602" y="500.0" font-family="DejaVu Sans Mono, monospace" font-size="18" font-weight="500" fill="#2F5D8A" text-anchor="start" letter-spacing="0">CAAM</text><rect x="1060" y="250" width="450" height="270" rx="14" fill="#FFFFFF" stroke="#D3D8D0" stroke-width="2"/><g transform="translate(1092,282) scale(1.6666666666666667)" fill="none" stroke="#2F5D8A" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4l9 16H3z"/><path d="M8 16c1.3-1 2.7-1 4 0s2.7 1 4 0"/></g><text x="1092" y="370.0" font-family="Inter Display, Inter, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#14181F" text-anchor="start" letter-spacing="0">Access</text><text x="1092" y="406.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#4F5864" text-anchor="start" letter-spacing="0">At height, remote, post-disaster,</text><text x="1092" y="435.7" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#4F5864" text-anchor="start" letter-spacing="0">repair in place.</text><text x="1092" y="500.0" font-family="DejaVu Sans Mono, monospace" font-size="18" font-weight="500" fill="#2F5D8A" text-anchor="start" letter-spacing="0">Nature · Imperial</text><rect x="80" y="550" width="450" height="270" rx="14" fill="#FFFFFF" stroke="#D3D8D0" stroke-width="2"/><g transform="translate(112,582) scale(1.6666666666666667)" fill="none" stroke="#2F5D8A" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="14" width="4" height="6" rx="1"/><rect x="10" y="10" width="4" height="10" rx="1"/><rect x="16" y="5" width="4" height="15" rx="1"/></g><text x="112" y="670.0" font-family="Inter Display, Inter, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#14181F" text-anchor="start" letter-spacing="0">A crew that scales</text><text x="112" y="706.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#4F5864" text-anchor="start" letter-spacing="0">Robots join or retire as the</text><text x="112" y="735.7" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#4F5864" text-anchor="start" letter-spacing="0">geometry changes.</text><text x="112" y="800.0" font-family="DejaVu Sans Mono, monospace" font-size="18" font-weight="500" fill="#2F5D8A" text-anchor="start" letter-spacing="0">Nature</text><rect x="570" y="550" width="450" height="270" rx="14" fill="#FFFFFF" stroke="#D3D8D0" stroke-width="2"/><g transform="translate(602,582) scale(1.6666666666666667)" fill="none" stroke="#2F5D8A" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"/><circle cx="12" cy="12" r="2.5"/></g><text x="602" y="670.0" font-family="Inter Display, Inter, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#14181F" text-anchor="start" letter-spacing="0">Sensing in the loop</text><text x="602" y="706.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#4F5864" text-anchor="start" letter-spacing="0">A scan drone checks every layer and</text><text x="602" y="735.7" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#4F5864" text-anchor="start" letter-spacing="0">corrects the next one.</text><text x="602" y="800.0" font-family="DejaVu Sans Mono, monospace" font-size="18" font-weight="500" fill="#2F5D8A" text-anchor="start" letter-spacing="0">Nature</text><rect x="1060" y="550" width="450" height="270" rx="14" fill="#FFFFFF" stroke="#D3D8D0" stroke-width="2"/><g transform="translate(1092,582) scale(1.6666666666666667)" fill="none" stroke="#2F5D8A" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><path d="M8.5 12.5l2.5 2.5 4.5-5"/></g><text x="1092" y="670.0" font-family="Inter Display, Inter, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#14181F" text-anchor="start" letter-spacing="0">Fewer people at height</text><text x="1092" y="706.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#4F5864" text-anchor="start" letter-spacing="0">Lower risk than manual work on</text><text x="1092" y="735.7" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#4F5864" text-anchor="start" letter-spacing="0">difficult sites.</text><text x="1092" y="800.0" font-family="DejaVu Sans Mono, monospace" font-size="18" font-weight="500" fill="#2F5D8A" text-anchor="start" letter-spacing="0">Imperial</text><text x="80" y="876.0" font-family="DejaVu Sans Mono, monospace" font-size="16" font-weight="400" fill="#4F5864" text-anchor="start" letter-spacing="0">Sources: Zhang et al., Nature 609 (2022) · Stuart-Smith et al., CAAM · Imperial College London</text></svg>