<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#F3F4F1"/><text x="80" y="96.0" font-family="DejaVu Sans Mono, monospace" font-size="20" font-weight="500" fill="#2F5D8A" text-anchor="start" letter-spacing="2">ONE DECISION MODEL, THREE LEVELS</text><text x="80" y="150.0" font-family="Inter Display, Inter, Helvetica, Arial, sans-serif" font-size="48" font-weight="700" fill="#14181F" text-anchor="start" letter-spacing="0">The same app scales with the project's complexity</text><rect x="80" y="250" width="450" height="520" rx="14" fill="#FFFFFF" stroke="#D3D8D0" stroke-width="2"/><g transform="translate(116,286) scale(1.6666666666666667)" fill="none" stroke="#2F5D8A" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="14" width="4" height="6" rx="1"/><rect x="10" y="10" width="4" height="10" rx="1" opacity=".25"/><rect x="16" y="5" width="4" height="15" rx="1" opacity=".25"/></g><text x="116" y="380.0" font-family="Inter Display, Inter, Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#14181F" text-anchor="start" letter-spacing="0">Basic</text><text x="116" y="420.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#4F5864" text-anchor="start" letter-spacing="0">Few decision-makers, simple</text><text x="116" y="448.6" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#4F5864" text-anchor="start" letter-spacing="0">approvals</text><circle cx="124" cy="492" r="5" fill="#2F5D8A"/><text x="142" y="500.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#14181F" text-anchor="start" letter-spacing="0">Decision inbox</text><circle cx="124" cy="540" r="5" fill="#2F5D8A"/><text x="142" y="548.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#14181F" text-anchor="start" letter-spacing="0">Approve, reject or ask</text><circle cx="124" cy="588" r="5" fill="#2F5D8A"/><text x="142" y="596.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#14181F" text-anchor="start" letter-spacing="0">Owner, due date, outcome</text><circle cx="124" cy="636" r="5" fill="#2F5D8A"/><text x="142" y="644.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#14181F" text-anchor="start" letter-spacing="0">Decision log</text><text x="116" y="730.0" font-family="DejaVu Sans Mono, monospace" font-size="18" font-weight="500" fill="#2F5D8A" text-anchor="start" letter-spacing="0">“Approve concept design v3”</text><rect x="570" y="250" width="450" height="520" rx="14" fill="#E3ECF6" stroke="#B9CDE4" stroke-width="2"/><g transform="translate(606,286) scale(1.6666666666666667)" fill="none" stroke="#2F5D8A" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="14" width="4" height="6" rx="1"/><rect x="10" y="10" width="4" height="10" rx="1"/><rect x="16" y="5" width="4" height="15" rx="1" opacity=".25"/></g><text x="606" y="380.0" font-family="Inter Display, Inter, Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#14181F" text-anchor="start" letter-spacing="0">Medium</text><text x="606" y="420.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#4F5864" text-anchor="start" letter-spacing="0">Trade-offs and phase gates</text><circle cx="614" cy="492" r="5" fill="#2F5D8A"/><text x="632" y="500.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#14181F" text-anchor="start" letter-spacing="0">Options × criteria</text><circle cx="614" cy="540" r="5" fill="#2F5D8A"/><text x="632" y="548.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#14181F" text-anchor="start" letter-spacing="0">Evidence and gates</text><circle cx="614" cy="588" r="5" fill="#2F5D8A"/><text x="632" y="596.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#14181F" text-anchor="start" letter-spacing="0">Risk register</text><circle cx="614" cy="636" r="5" fill="#2F5D8A"/><text x="632" y="644.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#14181F" text-anchor="start" letter-spacing="0">Budget and resources</text><text x="606" y="730.0" font-family="DejaVu Sans Mono, monospace" font-size="18" font-weight="500" fill="#2F5D8A" text-anchor="start" letter-spacing="0">“Choose the fabrication method”</text><rect x="1060" y="250" width="450" height="520" rx="14" fill="#14181F" stroke="#14181F" stroke-width="2"/><g transform="translate(1096,286) scale(1.6666666666666667)" fill="none" stroke="#F0B46A" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="14" width="4" height="6" rx="1"/><rect x="10" y="10" width="4" height="10" rx="1"/><rect x="16" y="5" width="4" height="15" rx="1"/></g><text x="1096" y="380.0" font-family="Inter Display, Inter, Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#F3F4F1" text-anchor="start" letter-spacing="0">Advanced</text><text x="1096" y="420.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#F3F4F1" text-anchor="start" letter-spacing="0">Live constraints, decisions every</text><text x="1096" y="448.6" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#F3F4F1" text-anchor="start" letter-spacing="0">layer</text><circle cx="1104" cy="492" r="5" fill="#F0B46A"/><text x="1122" y="500.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#F3F4F1" text-anchor="start" letter-spacing="0">Constraint graph</text><circle cx="1104" cy="540" r="5" fill="#F0B46A"/><text x="1122" y="548.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#F3F4F1" text-anchor="start" letter-spacing="0">Live machine and sensor data</text><circle cx="1104" cy="588" r="5" fill="#F0B46A"/><text x="1122" y="596.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#F3F4F1" text-anchor="start" letter-spacing="0">Recommendations with evidence</text><circle cx="1104" cy="636" r="5" fill="#F0B46A"/><text x="1122" y="644.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#F3F4F1" text-anchor="start" letter-spacing="0">Digital-twin checks</text><text x="1096" y="730.0" font-family="DejaVu Sans Mono, monospace" font-size="18" font-weight="500" fill="#F0B46A" text-anchor="start" letter-spacing="0">“Release layer 23 of the aerial build”</text><text x="80" y="840.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#4F5864" text-anchor="start" letter-spacing="0">Aerial AM is the Advanced case: the hardest test of a decision tool, because the decisions never stop.</text></svg>