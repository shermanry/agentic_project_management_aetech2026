<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="860" viewBox="0 0 1600 860"><rect width="1600" height="860" fill="#F3F4F1"/><text x="80" y="96.0" font-family="DejaVu Sans Mono, monospace" font-size="20" font-weight="500" fill="#2F5D8A" text-anchor="start" letter-spacing="2">EVIDENCE AND LIMITS</text><text x="80" y="150.0" font-family="Inter Display, Inter, Helvetica, Arial, sans-serif" font-size="48" font-weight="700" fill="#14181F" text-anchor="start" letter-spacing="0">What's been shown, and what hasn't</text><text x="80" y="340.0" font-family="Inter Display, Inter, Helvetica, Arial, sans-serif" font-size="84" font-weight="800" fill="#2F5D8A" text-anchor="start" letter-spacing="0">2.05 m</text><text x="80" y="400.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#4F5864" text-anchor="start" letter-spacing="0">foam tower, 72 layers, 29 min</text><text x="80" y="430.8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#4F5864" text-anchor="start" letter-spacing="0">of printing</text><text x="445" y="340.0" font-family="Inter Display, Inter, Helvetica, Arial, sans-serif" font-size="84" font-weight="800" fill="#2F5D8A" text-anchor="start" letter-spacing="0">≤5 mm</text><text x="445" y="400.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#4F5864" text-anchor="start" letter-spacing="0">accuracy with the delta arm,</text><text x="445" y="430.8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#4F5864" text-anchor="start" letter-spacing="0">within UK building</text><text x="445" y="461.6" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#4F5864" text-anchor="start" letter-spacing="0">requirements</text><text x="810" y="340.0" font-family="Inter Display, Inter, Helvetica, Arial, sans-serif" font-size="84" font-weight="800" fill="#2F5D8A" text-anchor="start" letter-spacing="0">2 h 13</text><text x="810" y="400.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#4F5864" text-anchor="start" letter-spacing="0">for an 18 cm, 28-layer cement</text><text x="810" y="430.8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#4F5864" text-anchor="start" letter-spacing="0">cylinder</text><text x="1175" y="340.0" font-family="Inter Display, Inter, Helvetica, Arial, sans-serif" font-size="84" font-weight="800" fill="#2F5D8A" text-anchor="start" letter-spacing="0">15</text><text x="1175" y="400.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#4F5864" text-anchor="start" letter-spacing="0">robots in simulation on a 15</text><text x="1175" y="430.8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#4F5864" text-anchor="start" letter-spacing="0">m geometry</text><rect x="80" y="560" width="1440" height="190" rx="14" fill="#14181F" stroke="#14181F" stroke-width="2"/><text x="116" y="620.0" font-family="DejaVu Sans Mono, monospace" font-size="18" font-weight="500" fill="#F0B46A" text-anchor="start" letter-spacing="1.5">NOT YET SHOWN</text><text x="116" y="670.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#F3F4F1" text-anchor="start" letter-spacing="0">Outdoor flight, automated refilling and charging, load-bearing parts, support material, and real deposition with</text><text x="116" y="704.8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#F3F4F1" text-anchor="start" letter-spacing="0">adaptive design. All tests were in a lab with external motion tracking.</text><text x="80" y="816.0" font-family="DejaVu Sans Mono, monospace" font-size="16" font-weight="400" fill="#4F5864" text-anchor="start" letter-spacing="0">Zhang et al., Nature 609, 709–717 (2022) · IEEE Spectrum · Stuart-Smith et al., CAAM</text></svg>