<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#F3F4F1"/><text x="80" y="96.0" font-family="DejaVu Sans Mono, monospace" font-size="20" font-weight="500" fill="#2F5D8A" text-anchor="start" letter-spacing="2">THE ARGUMENT</text><text x="80" y="150.0" font-family="Inter Display, Inter, Helvetica, Arial, sans-serif" font-size="48" font-weight="700" fill="#14181F" text-anchor="start" letter-spacing="0">Drones make construction flexible. Flexibility makes it</text><text x="80" y="203.8" font-family="Inter Display, Inter, Helvetica, Arial, sans-serif" font-size="48" font-weight="700" fill="#14181F" text-anchor="start" letter-spacing="0">data-heavy. We make it decidable.</text><rect x="80" y="260" width="450" height="380" rx="14" fill="#FFFFFF" stroke="#D3D8D0" stroke-width="2"/><rect x="80" y="260" width="450" height="10" rx="5" fill="#2F5D8A"/><text x="116" y="330.0" font-family="DejaVu Sans Mono, monospace" font-size="22" font-weight="500" fill="#2F5D8A" text-anchor="start" letter-spacing="0">01</text><text x="116" y="400.0" font-family="Inter Display, Inter, Helvetica, Arial, sans-serif" font-size="52" font-weight="700" fill="#2F5D8A" text-anchor="start" letter-spacing="0">Flexible</text><text x="116" y="470.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#4F5864" text-anchor="start" letter-spacing="0">Drones free the build from</text><text x="116" y="506.4" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#4F5864" text-anchor="start" letter-spacing="0">machine frames, rails and</text><text x="116" y="542.8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#4F5864" text-anchor="start" letter-spacing="0">tethers.</text><path d="M538 450 l20 0 m-8 -10 l10 10 l-10 10" stroke="#4F5864" stroke-width="3" fill="none"/><rect x="570" y="260" width="450" height="380" rx="14" fill="#FFFFFF" stroke="#D3D8D0" stroke-width="2"/><rect x="570" y="260" width="450" height="10" rx="5" fill="#B8661A"/><text x="606" y="330.0" font-family="DejaVu Sans Mono, monospace" font-size="22" font-weight="500" fill="#B8661A" text-anchor="start" letter-spacing="0">02</text><text x="606" y="400.0" font-family="Inter Display, Inter, Helvetica, Arial, sans-serif" font-size="52" font-weight="700" fill="#B8661A" text-anchor="start" letter-spacing="0">Data-heavy</text><text x="606" y="470.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#4F5864" text-anchor="start" letter-spacing="0">That freedom adds live</text><text x="606" y="506.4" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#4F5864" text-anchor="start" letter-spacing="0">variables: wind, robots,</text><text x="606" y="542.8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#4F5864" text-anchor="start" letter-spacing="0">material, stability.</text><path d="M1028 450 l20 0 m-8 -10 l10 10 l-10 10" stroke="#4F5864" stroke-width="3" fill="none"/><rect x="1060" y="260" width="450" height="380" rx="14" fill="#FFFFFF" stroke="#D3D8D0" stroke-width="2"/><rect x="1060" y="260" width="450" height="10" rx="5" fill="#14181F"/><text x="1096" y="330.0" font-family="DejaVu Sans Mono, monospace" font-size="22" font-weight="500" fill="#14181F" text-anchor="start" letter-spacing="0">03</text><text x="1096" y="400.0" font-family="Inter Display, Inter, Helvetica, Arial, sans-serif" font-size="52" font-weight="700" fill="#14181F" text-anchor="start" letter-spacing="0">Decidable</text><text x="1096" y="470.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#4F5864" text-anchor="start" letter-spacing="0">Our tool turns the data into</text><text x="1096" y="506.4" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#4F5864" text-anchor="start" letter-spacing="0">clear, timely, logged</text><text x="1096" y="542.8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#4F5864" text-anchor="start" letter-spacing="0">decisions.</text></svg>