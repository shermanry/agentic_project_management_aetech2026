ry</text><rect x="787.7290945327288" y="612.5310708473312" width="230" height="104" rx="12" fill="#FFFFFF" stroke="#D3D8D0" stroke-width="2"/><text x="805.7290945327288" y="642.5" font-family="DejaVu Sans Mono, monospace" font-size="16" font-weight="500" fill="#2F5D8A" text-anchor="start" letter-spacing="0">03</text><text x="805.7290945327288" y="674.5" font-family="Inter Display, Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#14181F" text-anchor="start" letter-spacing="0">Deposit</text><text x="805.7290945327288" y="700.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#4F5864" text-anchor="start" letter-spacing="0">Fly the path</text><rect x="630.8262843440918" y="809.2809716917016" width="230" height="104" rx="12" fill="#FFFFFF" stroke="#D3D8D0" stroke-width="2"/><text x="648.8262843440918" y="839.3" font-family="DejaVu Sans Mono, monospace" font-size="16" font-weight="500" fill="#2F5D8A" text-anchor="start" letter-spacing="0">04</text><text x="648.8262843440918" y="871.3" font-family="Inter Display, Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#14181F" text-anchor="start" letter-spacing="0">Scan</text><text x="648.8262843440918" y="897.3" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#4F5864" text-anchor="start" letter-spacing="0">Map the layer</text><rect x="379.17371565590815" y="809.2809716917016" width="230" height="104" rx="12" fill="#FFFFFF" stroke="#D3D8D0" stroke-width="2"/><text x="397.17371565590815" y="839.3" font-family="DejaVu Sans Mono, monospace" font-size="16" font-weight="500" fill="#2F5D8A" text-anchor="start" letter-spacing="0">05</text><text x="397.17371565590815" y="871.3" font-family="Inter Display, Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#14181F" text-anchor="start" letter-spacing="0">Evaluate</text><text x="397.17371565590815" y="897.3" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#4F5864" text-anchor="start" letter-spacing="0">Deviation, cure, stability</text><rect x="222.27090546727118" y="612.5310708473312" width="230" height="104" rx="12" fill="#FFFFFF" stroke="#D3D8D0" stroke-width="2"/><text x="240.27090546727118" y="642.5" font-family="DejaVu Sans Mono, monospace" font-size="16" font-weight="500" fill="#2F5D8A" text-anchor="start" letter-spacing="0">06</text><text x="240.27090546727118" y="674.5" font-family="Inter Display, Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#14181F" text-anchor="start" letter-spacing="0">Adapt</text><text x="240.27090546727118" y="700.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#4F5864" text-anchor="start" letter-spacing="0">Offset or redesign</text><rect x="278.2688700842713" y="367.1879574609673" width="230" height="104" rx="12" fill="#FBF1E4" stroke="#B8661A" stroke-width="3"/><text x="296.2688700842713" y="397.2" font-family="DejaVu Sans Mono, monospace" font-size="16" font-weight="500" fill="#B8661A" text-anchor="start" letter-spacing="0">07</text><text x="296.2688700842713" y="429.2" font-family="Inter Display, Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#14181F" text-anchor="start" letter-spacing="0">Decide</text><text x="296.2688700842713" y="455.2" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#4F5864" text-anchor="start" letter-spacing="0">Go · hold · adjust</text><text x="620" y="590.0" font-family="Inter Display, Inter, Helvetica, Arial, sans-serif" font-size="64" font-weight="800" fill="#2F5D8A" text-anchor="middle" letter-spacing="0">×72</text><text x="620" y="630.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4F5864" text-anchor="middle" letter-spacing="0">layers for a 2.05 m tower</text><rect x="1040" y="330" width="480" height="420" rx="14" fill="#14181F" stroke="#14181F" stroke-width="2"/><text x="1076" y="392.0" font-family="DejaVu Sans Mono, monospace" font-size="18" font-weight="500" fill="#F0B46A" text-anchor="start" letter-spacing="1.5">OUR TOOL LIVES AT 07</text><text x="1076" y="450.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#F3F4F1" text-anchor="start" letter-spacing="0">It brings the evidence from 04</text><text x="1076" y="487.7" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#F3F4F1" text-anchor="start" letter-spacing="0">and 05 to the person who</text><text x="1076" y="525.4" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#F3F4F1" text-anchor="start" letter-spacing="0">decides, with a recommended</text><text x="1076" y="563.1" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#F3F4F1" text-anchor="start" letter-spacing="0">action, and logs why.</text><text x="80" y="956.0" font-family="DejaVu Sans Mono, monospace" font-size="16" font-weight="400" fill="#4F5864" text-anchor="start" letter-spacing="0">Loop from Zhang et al., Nature 2022: scan after every layer, offset the next path, human supervision throughout</text></svg>