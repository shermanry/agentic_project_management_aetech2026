<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="986" viewBox="0 0 1600 986"><rect width="1600" height="986" fill="#F3F4F1"/><text x="80" y="96.0" font-family="DejaVu Sans Mono, monospace" font-size="20" font-weight="500" fill="#2F5D8A" text-anchor="start" letter-spacing="2">FREEDOM → DATA → DECISIONS</text><text x="80" y="150.0" font-family="Inter Display, Inter, Helvetica, Arial, sans-serif" font-size="48" font-weight="700" fill="#14181F" text-anchor="start" letter-spacing="0">Every freedom drones give creates something to decide</text><text x="80" y="262.0" font-family="DejaVu Sans Mono, monospace" font-size="18" font-weight="500" fill="#2F5D8A" text-anchor="start" letter-spacing="1.5">FREEDOM</text><text x="580" y="262.0" font-family="DejaVu Sans Mono, monospace" font-size="18" font-weight="500" fill="#B8661A" text-anchor="start" letter-spacing="1.5">DATA IT CREATES</text><text x="1080" y="262.0" font-family="DejaVu Sans Mono, monospace" font-size="18" font-weight="500" fill="#14181F" text-anchor="start" letter-spacing="1.5">DECISION IT DEMANDS</text><rect x="80" y="285" width="440" height="72" rx="10" fill="#E3ECF6" stroke="none" stroke-width="0"/><text x="104" y="330.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="600" fill="#14181F" text-anchor="start" letter-spacing="0">No fixed work area</text><path d="M528 321 l28 0 m-9 -8 l9 8 l-9 8" stroke="#4F5864" stroke-width="2.5" fill="none"/><rect x="580" y="285" width="440" height="72" rx="10" fill="#FBF1E4" stroke="none" stroke-width="0"/><text x="604" y="330.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#14181F" text-anchor="start" letter-spacing="0">Robot positions, spacing, crowding</text><path d="M1028 321 l28 0 m-9 -8 l9 8 l-9 8" stroke="#4F5864" stroke-width="2.5" fill="none"/><rect x="1080" y="285" width="440" height="72" rx="10" fill="#E4E8E2" stroke="none" stroke-width="0"/><text x="1104" y="330.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#14181F" text-anchor="start" letter-spacing="0">How many robots this layer</text><rect x="80" y="373" width="440" height="72" rx="10" fill="#E3ECF6" stroke="none" stroke-width="0"/><text x="104" y="418.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="600" fill="#14181F" text-anchor="start" letter-spacing="0">Builds in the open</text><path d="M528 409 l28 0 m-9 -8 l9 8 l-9 8" stroke="#4F5864" stroke-width="2.5" fill="none"/><rect x="580" y="373" width="440" height="72" rx="10" fill="#FBF1E4" stroke="none" stroke-width="0"/><text x="604" y="418.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#14181F" text-anchor="start" letter-spacing="0">Wind, temperature, light, site activity</text><path d="M1028 409 l28 0 m-9 -8 l9 8 l-9 8" stroke="#4F5864" stroke-width="2.5" fill="none"/><rect x="1080" y="373" width="440" height="72" rx="10" fill="#E4E8E2" stroke="none" stroke-width="0"/><text x="1104" y="418.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#14181F" text-anchor="start" letter-spacing="0">Pause, slow down or continue</text><rect x="80" y="461" width="440" height="72" rx="10" fill="#E3ECF6" stroke="none" stroke-width="0"/><text x="104" y="506.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="600" fill="#14181F" text-anchor="start" letter-spacing="0">Crew scales with geometry</text><path d="M528 497 l28 0 m-9 -8 l9 8 l-9 8" stroke="#4F5864" stroke-width="2.5" fill="none"/><rect x="580" y="461" width="440" height="72" rx="10" fill="#FBF1E4" stroke="none" stroke-width="0"/><text x="604" y="506.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#14181F" text-anchor="start" letter-spacing="0">Robot health, battery, failures</text><path d="M1028 497 l28 0 m-9 -8 l9 8 l-9 8" stroke="#4F5864" stroke-width="2.5" fill="none"/><rect x="1080" y="461" width="440" height="72" rx="10" fill="#E4E8E2" stroke="none" stroke-width="0"/><text x="1104" y="506.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#14181F" text-anchor="start" letter-spacing="0">Reassign the work or stop</text><rect x="80" y="549" width="440" height="72" rx="10" fill="#E3ECF6" stroke="none" stroke-width="0"/><text x="104" y="594.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="600" fill="#14181F" text-anchor="start" letter-spacing="0">Small loads, many trips</text><path d="M528 585 l28 0 m-9 -8 l9 8 l-9 8" stroke="#4F5864" stroke-width="2.5" fill="none"/><rect x="580" y="549" width="440" height="72" rx="10" fill="#FBF1E4" stroke="none" stroke-width="0"/><text x="604" y="594.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#14181F" text-anchor="start" letter-spacing="0">Material left, refills, open time</text><path d="M1028 585 l28 0 m-9 -8 l9 8 l-9 8" stroke="#4F5864" stroke-width="2.5" fill="none"/><rect x="1080" y="549" width="440" height="72" rx="10" fill="#E4E8E2" stroke="none" stroke-width="0"/><text x="1104" y="594.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#14181F" text-anchor="start" letter-spacing="0">When to refill, who prints next</text><rect x="80" y="637" width="440" height="72" rx="10" fill="#E3ECF6" stroke="none" stroke-width="0"/><text x="104" y="682.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="600" fill="#14181F" text-anchor="start" letter-spacing="0">Adapts after every layer</text><path d="M528 673 l28 0 m-9 -8 l9 8 l-9 8" stroke="#4F5864" stroke-width="2.5" fill="none"/><rect x="580" y="637" width="440" height="72" rx="10" fill="#FBF1E4" stroke="none" stroke-width="0"/><text x="604" y="682.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#14181F" text-anchor="start" letter-spacing="0">Scan of each layer vs design</text><path d="M1028 673 l28 0 m-9 -8 l9 8 l-9 8" stroke="#4F5864" stroke-width="2.5" fill="none"/><rect x="1080" y="637" width="440" height="72" rx="10" fill="#E4E8E2" stroke="none" stroke-width="0"/><text x="1104" y="682.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#14181F" text-anchor="start" letter-spacing="0">Accept deviation or correct</text><rect x="80" y="725" width="440" height="72" rx="10" fill="#E3ECF6" stroke="none" stroke-width="0"/><text x="104" y="770.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="600" fill="#14181F" text-anchor="start" letter-spacing="0">Freeform without scaffolding</text><path d="M528 761 l28 0 m-9 -8 l9 8 l-9 8" stroke="#4F5864" stroke-width="2.5" fill="none"/><rect x="580" y="725" width="440" height="72" rx="10" fill="#FBF1E4" stroke="none" stroke-width="0"/><text x="604" y="770.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#14181F" text-anchor="start" letter-spacing="0">Stability of every interim stage</text><path d="M1028 761 l28 0 m-9 -8 l9 8 l-9 8" stroke="#4F5864" stroke-width="2.5" fill="none"/><rect x="1080" y="725" width="440" height="72" rx="10" fill="#E4E8E2" stroke="none" stroke-width="0"/><text x="1104" y="770.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#14181F" text-anchor="start" letter-spacing="0">Release the next layer</text><rect x="80" y="813" width="440" height="72" rx="10" fill="#E3ECF6" stroke="none" stroke-width="0"/><text x="104" y="858.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="600" fill="#14181F" text-anchor="start" letter-spacing="0">Design open during build</text><path d="M528 849 l28 0 m-9 -8 l9 8 l-9 8" stroke="#4F5864" stroke-width="2.5" fill="none"/><rect x="580" y="813" width="440" height="72" rx="10" fill="#FBF1E4" stroke="none" stroke-width="0"/><text x="604" y="858.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#14181F" text-anchor="start" letter-spacing="0">Versions tied to what's built</text><path d="M1028 849 l28 0 m-9 -8 l9 8 l-9 8" stroke="#4F5864" stroke-width="2.5" fill="none"/><rect x="1080" y="813" width="440" height="72" rx="10" fill="#E4E8E2" stroke="none" stroke-width="0"/><text x="1104" y="858.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#14181F" text-anchor="start" letter-spacing="0">Approve a redesign, and why</text></svg>