<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Knowledge Tree Intake</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23ff7a3d'/%3E%3Cg fill='none' stroke='%23111' stroke-width='2.2' stroke-linecap='round'%3E%3Ccircle cx='12' cy='6' r='2'/%3E%3Ccircle cx='6.5' cy='17.5' r='2'/%3E%3Ccircle cx='17.5' cy='17.5' r='2'/%3E%3Cpath d='M12 8v3.5l-4.5 4M12 11.5l4.5 4'/%3E%3C/g%3E%3C/svg%3E">
<style>
:root {
  --bg: #101010; --rail: #0b0b0b; --panel: #1a1a1a; --panel2: #222224; --hover: #26262b; --line: #2a2a30; --line2: #36363d;
  --ink: #ededee; --soft: #c9c9ce; --muted: #8b8b93; --faint: #5d5d66;
  --accent: #ff7a3d; --accent-soft: rgba(255, 122, 61, .14);
  --ok: #46c48a; --warn: #e7b04a; --err: #ff6b5e;
  --text: #6ea8ff; --image: #46c48a; --audio: #c58cff; --video: #ff7a3d;
  --r: 18px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font: 15px/1.5 "Suisse Intl", "Inter", "Segoe UI Variable", "Segoe UI", system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; }
a { color: inherit; }
::selection { background: var(--accent-soft); }
::-webkit-scrollbar { width: 10px; height: 10px; } ::-webkit-scrollbar-thumb { background: #2c2c32; border-radius: 10px; border: 2px solid var(--bg); }

/* ---------- rail */
.rail { position: fixed; inset: 0 auto 0 0; width: 64px; background: var(--rail); border-right: 1px solid #1b1b1f; display: flex; flex-direction: column; align-items: center; padding: 14px 0; gap: 6px; z-index: 5; }
.rail .logo { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; margin-bottom: 18px; background: linear-gradient(135deg, #ff7a3d, #c2410c); }
.rail .ic { width: 42px; height: 42px; border-radius: 12px; border: 0; background: transparent; display: grid; place-items: center; color: var(--muted); transition: .15s; position: relative; }
.rail .ic:hover, .rail .ic.on { background: var(--hover); color: var(--ink); }
.rail .ic svg { width: 21px; height: 21px; }
.rail .ic .badge { position: absolute; top: 6px; right: 6px; min-width: 16px; height: 16px; border-radius: 8px; background: var(--accent); color: #111; font-size: 10px; font-weight: 700; display: grid; place-items: center; padding: 0 4px; }
.rail .badge:empty { display: none; }
.rail .grow { flex: 1; }
.rail .me { width: 38px; height: 38px; border-radius: 12px; background: var(--panel2); border: 1px solid var(--line); display: grid; place-items: center; font-weight: 600; color: var(--soft); }
.tip { position: absolute; left: 52px; background: #000; color: #fff; padding: 4px 8px; border-radius: 6px; font-size: 12px; white-space: nowrap; opacity: 0; pointer-events: none; transition: .12s; }
.rail .ic:hover .tip { opacity: 1; }

main { margin-left: 64px; padding: 36px 28px 80px; }
.wrap { max-width: 1040px; margin: 0 auto; }

/* ---------- hero */
.hero { display: flex; flex-direction: column; align-items: center; gap: 22px; padding-top: 6px; }
.banner { width: min(420px, 100%); aspect-ratio: 420 / 180; border-radius: 16px; overflow: hidden; position: relative; background: #1a1a1d; box-shadow: 0 30px 80px -30px rgba(255,122,61,.25); }
.banner .tiles { position: absolute; inset: -12%; display: grid; grid-template-columns: repeat(3, 1fr); filter: blur(18px) saturate(1.25) brightness(.95); animation: drift 26s ease-in-out infinite alternate; }
.banner .tiles div { background-size: cover; background-position: center; }
.banner .aurora { position: absolute; inset: 0; background:
   radial-gradient(60% 80% at 20% 30%, rgba(255,122,61,.55), transparent 60%),
   radial-gradient(50% 70% at 80% 60%, rgba(110,168,255,.45), transparent 60%),
   radial-gradient(40% 60% at 55% 90%, rgba(197,140,255,.35), transparent 60%), #17171a; animation: drift 18s ease-in-out infinite alternate; }
.banner::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(13,13,14,0) 40%, rgba(13,13,14,.35)); }
.banner .stat { position: absolute; left: 16px; bottom: 12px; z-index: 1; font-size: 12px; color: rgba(255,255,255,.85); display: flex; gap: 14px; text-shadow: 0 1px 8px rgba(0,0,0,.6); }
@keyframes drift { from { transform: scale(1.05) translate(-2%, -1%); } to { transform: scale(1.12) translate(2%, 1%); } }
@media (prefers-reduced-motion: reduce) { .banner .tiles, .banner .aurora { animation: none; } }
h1 { font-size: clamp(22px, 2.8vw, 28px); font-weight: 400; letter-spacing: -.01em; margin: 0; text-align: center; }

/* ---------- composer */
#composer { width: min(1000px, 100%); background: rgba(43,43,43,.8); backdrop-filter: blur(20px); border: .5px solid rgba(255,255,255,.15); border-radius: 32px; padding: 18px 14px 12px 24px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 1px 0 rgba(255,255,255,.04) inset, 0 20px 50px -20px rgba(0,0,0,.6); transition: border-color .15s, background .15s; }
#composer:focus-within { border-color: rgba(255,255,255,.28); }
#composer.over { border-color: var(--accent); background: #1e1916; }
#prompt { border: 0; outline: 0; resize: none; background: transparent; color: var(--ink); font: 16px/1.55 inherit; font-family: inherit; min-height: 30px; max-height: 260px; padding: 4px 0; }
#prompt::placeholder { color: var(--faint); }
#tray { display: flex; gap: 8px; flex-wrap: wrap; }
#tray:empty { display: none; }
.att { display: flex; align-items: center; gap: 8px; background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; padding: 5px 4px 5px 5px; font-size: 12.5px; max-width: 260px; animation: pop .18s ease-out; }
.att img, .att .ext { width: 38px; height: 38px; border-radius: 8px; object-fit: cover; flex-shrink: 0; }
.att .ext { display: grid; place-items: center; background: #2a2a30; font-weight: 700; color: var(--muted); font-size: 10px; letter-spacing: .04em; }
.att .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--soft); }
.att button { border: 0; background: transparent; color: var(--muted); width: 24px; height: 24px; border-radius: 8px; }
.att button:hover { background: var(--hover); color: var(--ink); }
@keyframes pop { from { transform: scale(.94); opacity: 0; } }
.bar { display: flex; align-items: center; gap: 8px; }
.bar .grow { flex: 1; }
.round { width: 40px; height: 40px; border-radius: 50%; border: 0; background: rgba(255,255,255,.08); display: grid; place-items: center; color: var(--soft); transition: .15s; flex-shrink: 0; }
.round:hover { background: var(--hover); color: var(--ink); }
.round svg { width: 18px; height: 18px; }
.round.rec { background: var(--err); color: #fff; border-color: var(--err); animation: pulse 1.2s infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 8px rgba(255,107,94,.15); } }
#send { width: 44px; height: 44px; background: #f3f3f4; color: #111; border: 0; }
#send:hover { background: #fff; transform: scale(1.04); }
#send:disabled { opacity: .35; cursor: not-allowed; transform: none; }
.mode { position: relative; }
.mode button { border: 0; background: transparent; color: var(--soft); padding: 8px 10px; border-radius: 12px; display: flex; gap: 6px; align-items: center; white-space: nowrap; }
.mode button:hover { background: var(--hover); }
.mode b { font-weight: 600; color: var(--ink); }
.menu { position: absolute; right: 0; bottom: 46px; background: var(--panel2); border: 1px solid var(--line2); border-radius: 14px; padding: 6px; width: 290px; display: none; z-index: 10; box-shadow: 0 20px 50px rgba(0,0,0,.5); }
.menu.open { display: block; }
.menu .opt { padding: 10px 12px; border-radius: 10px; cursor: pointer; }
.menu .opt:hover { background: var(--hover); }
.menu .opt.on { background: var(--accent-soft); }
.menu .opt b { display: block; font-weight: 600; }
.menu .opt span { color: var(--muted); font-size: 12px; }
.menu .opt.off { opacity: .4; pointer-events: none; }
.hint { color: var(--faint); font-size: 12px; }
kbd { font: 11px ui-monospace, Consolas, monospace; border: 1px solid var(--line2); border-bottom-width: 2px; border-radius: 5px; padding: 0 4px; color: var(--muted); }

#manual { width: min(1000px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 14px 16px; display: none; gap: 10px; flex-direction: column; }
#manual.open { display: flex; }
#manual .hd2 { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
#manual .hd2 b { font-size: 13px; }
#manual label { display: flex; flex-direction: column; gap: 4px; font-size: 11px; color: var(--muted); flex: 1; min-width: 130px; }
#manual .row { display: flex; gap: 10px; flex-wrap: wrap; }
#manual input, #manual select, #manual textarea, .field { font: inherit; font-size: 13px; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; width: 100%; outline: 0; }
#manual input:focus, #manual select:focus, #manual textarea:focus, .field:focus { border-color: var(--line2); }
.formats { font-size: 11.5px; color: var(--muted); line-height: 1.7; }
.formats b { color: var(--soft); font-weight: 600; }

.starters { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; max-width: 900px; }
.starter { border: 1px solid var(--line); background: transparent; color: var(--soft); border-radius: 999px; padding: 7px 14px; font-size: 13px; transition: .15s; }
.starter:hover { background: var(--panel2); color: var(--ink); border-color: var(--line2); }

/* ---------- feed (agent runs) */
#feed { display: flex; flex-direction: column; gap: 14px; margin-top: 30px; }
#feed:empty { display: none; }
.run { background: var(--panel); border: 1px solid var(--line); border-radius: 20px; overflow: hidden; animation: pop .2s ease-out; }
.you { padding: 14px 18px; display: flex; gap: 12px; align-items: flex-start; border-bottom: 1px solid var(--line); }
.you .av { width: 28px; height: 28px; border-radius: 9px; background: var(--panel2); border: 1px solid var(--line); display: grid; place-items: center; font-size: 12px; font-weight: 600; color: var(--soft); flex-shrink: 0; }
.you .p { color: var(--ink); font-size: 15px; }
.you .f { color: var(--muted); font-size: 12px; margin-top: 2px; }
.status { padding: 18px; color: var(--muted); display: flex; gap: 12px; align-items: center; }
.steps { display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
.steps .s { opacity: .4; transition: opacity .3s; } .steps .s.on { opacity: 1; color: var(--soft); } .steps .s.done { opacity: .7; }
.spin { width: 16px; height: 16px; border: 2px solid var(--line2); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; flex-shrink: 0; }
@keyframes spin { to { transform: rotate(360deg); } }
.res { display: grid; grid-template-columns: 132px minmax(0, 1fr); gap: 18px; padding: 18px; border-top: 1px solid var(--line); }
.res:first-of-type { border-top: 0; }
.res .th { width: 132px; aspect-ratio: 4/3; border-radius: 12px; background: var(--panel2); overflow: hidden; display: grid; place-items: center; font-weight: 700; color: var(--muted); cursor: pointer; }
.res .th img { width: 100%; height: 100%; object-fit: cover; }
.res .t { font-weight: 600; font-size: 16px; letter-spacing: -.01em; }
.res .sum { color: var(--soft); margin: 6px 0; }
.lk { font-size: 12.5px; color: var(--muted); margin-top: 4px; }
.lk a { color: var(--soft); text-decoration: none; border-bottom: 1px dotted var(--faint); cursor: pointer; }
.lk a:hover { color: var(--ink); }
.acts { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; align-items: center; }
.acts .grow { flex: 1; }
.btn { border: 1px solid var(--line); background: var(--panel2); color: var(--ink); border-radius: 10px; padding: 7px 12px; font-size: 13px; text-decoration: none; display: inline-flex; gap: 6px; align-items: center; transition: .15s; }
.btn:hover { background: var(--hover); border-color: var(--line2); }
.btn.primary { background: #f3f3f4; color: #111; border-color: #f3f3f4; font-weight: 600; }
.btn.primary:hover { background: #fff; }
.btn:disabled { opacity: .4; cursor: progress; }
.foot { padding: 10px 18px; border-top: 1px solid var(--line); font-size: 11.5px; color: var(--faint); }
.quote { border-left: 2px solid var(--accent); padding: 8px 12px; margin: 8px 0; background: var(--accent-soft); border-radius: 0 10px 10px 0; color: var(--ink); white-space: pre-wrap; }
.q { display: flex; gap: 10px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 9px 14px; font-size: 13px; margin-top: 8px; }
.q .st { margin-left: auto; color: var(--muted); } .q.done .st { color: var(--ok); } .q.fail .st { color: var(--err); }
.q a { color: var(--soft); }

/* ---------- chips */
.chip { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 2px 9px; font-size: 11.5px; background: var(--panel2); color: var(--soft); border: 1px solid var(--line); white-space: nowrap; }
.chip b { font-weight: 600; color: var(--muted); }
.nt { background: rgba(110,168,255,.12); color: #9cc2ff; border-color: transparent; }
.nt-decision { background: rgba(255,122,61,.14); color: #ffab80; } .nt-constraint { background: rgba(231,176,74,.14); color: #f0cb7f; }
.nt-discovery { background: rgba(197,140,255,.14); color: #d8b4ff; } .nt-event { background: rgba(70,196,138,.14); color: #86dfb3; }
.nt-blocker { background: rgba(255,107,94,.16); color: #ff9b91; } .nt-deliverable { background: rgba(110,168,255,.14); color: #9cc2ff; }
.imp-low { color: var(--muted); } .imp-medium { color: #9cc2ff; border-color: rgba(110,168,255,.3); }
.imp-high { color: #ffab80; border-color: rgba(255,122,61,.4); } .imp-critical { background: var(--err); color: #fff; border-color: var(--err); }
.st-suggested { color: var(--warn); border-color: rgba(231,176,74,.35); } .st-accepted { color: var(--ok); border-color: rgba(70,196,138,.35); }
.dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
.d-text { background: var(--text); } .d-image { background: var(--image); } .d-audio { background: var(--audio); } .d-video { background: var(--video); }

/* ---------- library */
.libhd { display: flex; align-items: center; gap: 10px; margin: 48px 0 16px; flex-wrap: wrap; }
.libhd h2 { font-size: 15px; font-weight: 600; margin: 0 8px 0 0; }
.pills { display: flex; gap: 4px; flex-wrap: wrap; }
.pill { border: 0; background: transparent; color: var(--muted); padding: 8px 14px; border-radius: 999px; font-size: 13px; display: inline-flex; gap: 6px; align-items: center; transition: .15s; }
.pill:hover { color: var(--ink); }
.pill.on { background: rgba(255,255,255,.08); color: var(--ink); }
.pill svg { width: 15px; height: 15px; }
.pill .n { color: var(--faint); font-size: 11px; }
.libhd .grow { flex: 1; }
#search { width: 220px; background: var(--panel); border: 1px solid var(--line); color: var(--ink); border-radius: 999px; padding: 8px 14px; outline: 0; font: inherit; font-size: 13px; }
#search:focus { border-color: var(--line2); }
.toggle { color: var(--muted); font-size: 12px; display: flex; gap: 6px; align-items: center; cursor: pointer; user-select: none; }
#grid { columns: 4 220px; column-gap: 12px; }
.card { position: relative; border-radius: 16px; overflow: hidden; background: var(--panel); border: 1px solid #1d1d1d; cursor: pointer; break-inside: avoid; margin-bottom: 12px; transition: transform .18s, border-color .18s; }
.card:hover { transform: translateY(-3px); border-color: var(--line2); }
.card .th { position: relative; display: grid; place-items: center; overflow: hidden; min-height: 190px; }
.card .th img { display: block; width: 100%; height: auto; transition: transform .4s; }
.card .th:has(img) { min-height: 0; }
.card:hover .th img { transform: scale(1.04); }
.card .th .ext { font-size: 30px; font-weight: 800; letter-spacing: .06em; color: rgba(255,255,255,.18); }
.card .th.k-email { background: radial-gradient(circle at 30% 20%, #2a3550, #18181b 70%); }
.card .th.k-document { background: radial-gradient(circle at 30% 20%, #3a2e22, #18181b 70%); }
.card .th.k-text, .card .th.k-data, .card .th.k-web { background: radial-gradient(circle at 30% 20%, #23302a, #18181b 70%); }
.card .th.k-audio { background: radial-gradient(circle at 30% 20%, #33264a, #18181b 70%); }
.card .th.k-archive, .card .th.k-spreadsheet, .card .th.k-presentation { background: radial-gradient(circle at 30% 20%, #2c2c33, #18181b 70%); }
.card .over { position: absolute; left: 0; right: 0; bottom: 0; padding: 40px 12px 10px; background: linear-gradient(180deg, transparent, rgba(10,10,11,.92) 55%); }
.card .t { font-weight: 600; font-size: 13.5px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card .m { display: flex; gap: 5px; align-items: center; margin-top: 6px; flex-wrap: wrap; font-size: 11.5px; color: var(--muted); }
.card .tag { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; gap: 6px; z-index: 1; }
.card .tag .chip { backdrop-filter: blur(8px); background: rgba(13,13,14,.6); }
.card.imp-high-c { box-shadow: inset 0 0 0 1px rgba(255,122,61,.45); } .card.imp-critical-c { box-shadow: inset 0 0 0 1px rgba(255,107,94,.8); }
.empty { color: var(--muted); padding: 50px 20px; text-align: center; column-span: all; border: 1px dashed var(--line); border-radius: 16px; }

/* ---------- drawer */
#scrim { position: fixed; inset: 0; background: rgba(0,0,0,.45); opacity: 0; pointer-events: none; transition: .2s; z-index: 9; }
#scrim.open { opacity: 1; pointer-events: auto; }
#drawer { position: fixed; inset: 10px 10px 10px auto; width: min(720px, calc(100vw - 20px)); background: var(--panel); border: 1px solid var(--line); border-radius: 22px; transform: translateX(calc(100% + 20px)); transition: transform .25s cubic-bezier(.2,.8,.2,1); overflow-y: auto; z-index: 10; box-shadow: -20px 0 60px rgba(0,0,0,.5); }
#drawer.open { transform: none; }
#drawer .hd { position: sticky; top: 0; background: rgba(24,24,27,.92); backdrop-filter: blur(12px); padding: 18px 22px 14px; border-bottom: 1px solid var(--line); display: flex; gap: 12px; align-items: flex-start; z-index: 1; }
#drawer .hd h3 { margin: 0; font-size: 18px; letter-spacing: -.01em; word-break: break-word; }
#drawer .hd .id { color: var(--faint); font: 11.5px ui-monospace, Consolas, monospace; margin-top: 4px; }
#drawer .hd .acts { margin: 0 0 0 auto; flex-shrink: 0; flex-wrap: nowrap; }
.sec { padding: 18px 22px; border-bottom: 1px solid var(--line); }
.sec h4 { margin: 0 0 10px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.sec .sub { margin-top: 16px; }
.agentbox { background: linear-gradient(180deg, rgba(255,122,61,.07), transparent 70%); }
.insight { border-left: 2px solid var(--line2); padding: 6px 12px; margin: 8px 0; color: var(--soft); }
.insight .why { color: var(--muted); font-size: 12px; margin-top: 2px; }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.gallery img { width: 100%; aspect-ratio: 4/3; object-fit: cover; border-radius: 10px; border: 1px solid var(--line); cursor: zoom-in; background: #fff; }
.gallery figure { margin: 0; } .gallery figcaption { font-size: 11.5px; color: var(--muted); margin-top: 4px; }
.region { display: grid; grid-template-columns: 130px 1fr; gap: 12px; align-items: start; margin-bottom: 10px; }
.region img { width: 130px; border-radius: 10px; border: 2px solid var(--accent); cursor: zoom-in; background: #fff; }
.ent { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
.tabs { display: flex; gap: 4px; margin-bottom: 10px; flex-wrap: wrap; }
.chunk { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; background: var(--bg); }
.chunk .ch { display: flex; gap: 8px; align-items: center; font-size: 11px; color: var(--muted); margin-bottom: 6px; flex-wrap: wrap; }
.chunk code { font: 11px ui-monospace, Consolas, monospace; color: var(--faint); margin-left: auto; }
.chunk pre { margin: 0; white-space: pre-wrap; word-break: break-word; font: 12.5px/1.55 ui-monospace, Consolas, monospace; color: var(--soft); max-height: 240px; overflow: auto; }
.chunk img, .chunk video { max-width: 100%; max-height: 300px; border-radius: 8px; display: block; margin-bottom: 6px; }
.chunk audio { width: 100%; margin-bottom: 6px; }
details summary { cursor: pointer; color: var(--muted); font-size: 12px; }
details pre { font: 11.5px ui-monospace, Consolas, monospace; white-space: pre-wrap; word-break: break-word; background: var(--bg); padding: 12px; border-radius: 10px; max-height: 400px; overflow: auto; color: var(--soft); }
.warnbox { background: rgba(231,176,74,.1); color: #f0cb7f; border: 1px solid rgba(231,176,74,.25); border-radius: 10px; padding: 9px 12px; font-size: 12.5px; }
.muted { color: var(--muted); } .small { font-size: 12px; }
#lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.9); display: none; place-items: center; z-index: 20; cursor: zoom-out; }
#lightbox img { max-width: 94vw; max-height: 92vh; border-radius: 10px; background: #fff; }
#toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(20px); background: #f3f3f4; color: #111; padding: 9px 16px; border-radius: 999px; font-size: 13px; opacity: 0; transition: .2s; z-index: 30; pointer-events: none; }
#toast.show { opacity: 1; transform: translateX(-50%); }

@media (max-width: 720px) {
  .rail { width: 52px; } main { margin-left: 52px; padding: 20px 14px 60px; }
  .hint, .mode .lbl { display: none; }
  #prompt { font-size: 16px; min-height: 70px; }
  .res { grid-template-columns: 1fr; } .res .th { width: 100%; }
  #search { width: 100%; } .libhd .grow { display: none; }
  .pills { flex-wrap: nowrap; overflow-x: auto; width: 100%; scrollbar-width: none; } .pill { flex-shrink: 0; }
  .starters { flex-wrap: nowrap; overflow-x: auto; justify-content: flex-start; width: 100%; scrollbar-width: none; } .starter { flex-shrink: 0; }
  #grid { columns: 2 140px; }
}
</style>
</head>
<body>
<nav class="rail" aria-label="Main">
  <div class="logo" title="Knowledge Tree Intake"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#111" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="5" r="2.2"/><circle cx="5.5" cy="18" r="2.2"/><circle cx="18.5" cy="18" r="2.2"/><path d="M12 7.2v4.3M12 11.5l-5.2 4.6M12 11.5l5.2 4.6"/></svg></div>
  <button class="ic on" data-go="new" aria-label="New intake"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><path d="M12 8v8M8 12h8"/></svg><span class="tip">New intake</span></button>
  <button class="ic" data-go="library" aria-label="Library"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3.5 7.5a2 2 0 0 1 2-2h4l2 2h7a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/></svg><span class="tip">Library</span></button>
  <button class="ic" data-go="decision" aria-label="Decisions"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="4" y="4" width="6.5" height="6.5" rx="2"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="2"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="2"/><path d="M16.75 13.5v6.5M13.5 16.75H20"/></svg><span class="badge" id="decCount"></span><span class="tip">Needs a decision</span></button>
  <button class="ic" data-go="markup" aria-label="Markups"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 4 20 18H4z"/><circle cx="7" cy="18" r="2.2"/><circle cx="17" cy="18" r="2.2"/></svg><span class="tip">Markups</span></button>
  <button class="ic" data-go="feed" aria-label="Agent activity"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 5.5h14a1.5 1.5 0 0 1 1.5 1.5v8.5A1.5 1.5 0 0 1 19 17h-7l-4.5 3.5V17H5a1.5 1.5 0 0 1-1.5-1.5V7A1.5 1.5 0 0 1 5 5.5z"/></svg><span class="tip">Agent activity</span></button>
  <span class="grow"></span>
  <button class="ic" data-go="settings" aria-label="Details and formats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg><span class="tip">Manual details · formats</span></button>
  <div class="me" id="me" title="You">·</div>
</nav>

<main>
<div class="wrap">
  <section class="hero" id="top">
    <div class="banner" id="banner"><div class="aurora"></div><div class="stat" id="bannerStat"></div></div>
    <h1 id="greet">What goes into the tree?</h1>

    <section id="composer">
      <div id="tray"></div>
      <textarea id="prompt" rows="1" placeholder="Drop or paste files, then say what they are…" title="Drag & drop anywhere · Ctrl+V pastes screenshots · Ctrl+Enter sends"></textarea>
      <div class="bar">
        <button class="round" id="attach" title="Add files" aria-label="Add files"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg></button>
        <span class="grow"></span>
        <div class="mode">
          <button id="modeBtn" type="button" aria-haspopup="true"><b id="modeName">Agent</b><span class="lbl muted" id="modeSub">Sonnet 5.5</span>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m6 9 6 6 6-6"/></svg></button>
          <div class="menu" id="modeMenu" role="menu">
            <div class="opt" data-mode="agent" role="menuitem"><b>Agent</b><span id="optAgentSub">Reads the files, extracts what matters, links it. You approve.</span></div>
            <div class="opt" data-mode="local" role="menuitem"><b>Convert only</b><span>Local extraction, no AI, nothing leaves this machine.</span></div>
          </div>
        </div>
        <button class="round" id="mic" title="Dictate" aria-label="Dictate" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="9" y="3.5" width="6" height="11" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v2.5"/></svg></button>
        <button class="round" id="send" title="Add to knowledge tree (Ctrl+Enter)" aria-label="Send"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
      </div>
      <input type="file" id="picker" multiple hidden>
    </section>

    <section id="manual">
      <div class="hd2"><b>Manual details</b><span class="muted small">Used by “Convert only”. The agent fills these in for you.</span></div>
      <form id="ctx" autocomplete="off" onsubmit="return false" style="display:flex;flex-direction:column;gap:10px">
        <div class="row">
          <label>From<input id="c_author" placeholder="e.g. J. Smith"></label>
          <label>Role<select id="c_role"><option value="">–</option><option>client</option><option>project lead</option>
            <option>team</option><option>contractor</option><option>consultant</option><option>me</option></select></label>
          <label>Via<select id="c_channel"><option value="">–</option><option>teams</option><option>email</option>
            <option>slack</option><option>meeting</option><option>site</option><option>whatsapp</option></select></label>
        </div>
        <label>Message / note<textarea id="c_note" rows="2" placeholder="The message that came with the file"></textarea></label>
        <div class="row">
          <label>This is<select id="c_intent"><option value="">auto-detect</option><option value="markup">a markup / change request</option>
            <option value="reference">just a reference image</option></select></label>
          <label style="flex:2">Marks up<select id="c_ref"><option value="">auto-detect the original</option></select></label>
        </div>
      </form>
      <div class="formats" id="formats"></div>
    </section>

    <div class="starters" id="starters">
      <button class="starter" data-p="Client markup: they want a change. Find what it marks up and what decision it needs.">✎ Client markup</button>
      <button class="starter" data-p="Email thread: pull out the ask, the decision, who owns it and the deadline.">✉ Email → decisions</button>
      <button class="starter" data-p="Report or drawing set: keep only the key statements, constraints and the figures worth keeping.">▤ Long document → key points</button>
      <button class="starter" data-p="Rhino model update: describe the design and what changed.">◇ Model update</button>
      <button class="starter" data-p="Site photos / drone footage: what do they show, any defects or risks?">◉ Site capture</button>
    </div>
  </section>

  <div id="feed"></div>
  <div id="queue"></div>

  <section id="lib">
    <div class="libhd">
      <h2>Library</h2>
      <div class="pills" id="pills"></div>
      <span class="grow"></span>
      <label class="toggle"><input type="checkbox" id="showChildren" checked> attachments</label>
      <input id="search" placeholder="Search nodes…" aria-label="Search">
    </div>
    <div id="grid"></div>
  </section>
</div>
</main>

<div id="scrim"></div>
<aside id="drawer" aria-label="Node details"></aside>
<div id="lightbox"><img alt=""></div>
<div id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store = { get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
let library = [];
const toast = msg => { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2200); };

// ---------- greeting
(() => { const h = new Date().getHours(); const part = h < 5 ? "tonight" : h < 12 ? "this morning" : h < 18 ? "this afternoon" : "this evening";
  $("#greet").textContent = `What goes into the tree ${part}?`; })();

// ---------- formats
fetch("/api/formats").then(r => r.json()).then(f => {
  const by = {};
  for (const [ext, kind] of Object.entries(f)) (by[kind] ||= []).push(ext);
  $("#formats").innerHTML = Object.entries(by).map(([k, e]) => `<b>${esc(k)}</b> ${esc(e.join(" "))}`).join(" · ");
});

// ---------- mode: agent / local
let agentOn = false, mode = store.get("uep_mode", "agent");
function setMode(m) {
  mode = (m === "agent" && !agentOn) ? "local" : m; store.set("uep_mode", mode);
  $("#modeName").textContent = mode === "agent" ? "Agent" : "Convert only";
  $("#modeSub").textContent = mode === "agent" ? (window._agentShort || "") : "local";
  document.querySelectorAll(".menu .opt").forEach(o => o.classList.toggle("on", o.dataset.mode === mode));
  $("#manual").classList.toggle("open", mode === "local" && store.get("uep_manual_open", false));
}
fetch("/api/agent").then(r => r.json()).then(a => {
  agentOn = a.available;
  window._agentShort = (a.agent_model || "").split("/").pop().replace(/^claude-/, "").replace(/-(\d)/, " $1").replace(/^./, c => c.toUpperCase());
  $("#optAgentSub").textContent = a.available ? `Reads the files, extracts what matters, links it. ${a.agent_model} via OpenRouter.`
    : "Unavailable: add OPENROUTER_API_KEY to .env";
  document.querySelector('.opt[data-mode="agent"]').classList.toggle("off", !a.available);
  setMode(mode);
});
$("#modeBtn").onclick = e => { e.stopPropagation(); $("#modeMenu").classList.toggle("open"); };
document.querySelectorAll(".menu .opt").forEach(o => o.onclick = () => { setMode(o.dataset.mode); $("#modeMenu").classList.remove("open"); });
document.addEventListener("click", () => $("#modeMenu").classList.remove("open"));

// ---------- composer: files wait in the tray until you send them
const composer = $("#composer"), picker = $("#picker"), promptEl = $("#prompt");
let tray = [];
function grow() { promptEl.style.height = "auto"; promptEl.style.height = Math.min(promptEl.scrollHeight, 260) + "px"; }
promptEl.addEventListener("input", grow);
function addToTray(files) {
  for (const f of files) tray.push({ f, url: f.type.startsWith("image/") ? URL.createObjectURL(f) : null });
  drawTray(); promptEl.focus();
}
function drawTray() {
  $("#tray").innerHTML = tray.map((t, i) => `<div class="att">${t.url ? `<img src="${t.url}" alt="">` :
    `<span class="ext">${esc((t.f.name.split(".").pop() || "").toUpperCase().slice(0, 4))}</span>`}
    <span class="nm" title="${esc(t.f.name)}">${esc(t.f.name)}</span><button data-rm="${i}" aria-label="Remove">✕</button></div>`).join("");
  document.querySelectorAll("[data-rm]").forEach(b => b.onclick = () => { tray.splice(+b.dataset.rm, 1); drawTray(); });
}
function takeTray() { const files = tray.map(t => t.f); tray.forEach(t => t.url && URL.revokeObjectURL(t.url)); tray = []; drawTray(); return files; }
$("#attach").onclick = () => picker.click();
picker.onchange = () => { addToTray([...picker.files]); picker.value = ""; };
let dragDepth = 0;
document.addEventListener("dragenter", e => { e.preventDefault(); dragDepth++; composer.classList.add("over"); });
document.addEventListener("dragover", e => e.preventDefault());
document.addEventListener("dragleave", e => { e.preventDefault(); if (--dragDepth <= 0) { dragDepth = 0; composer.classList.remove("over"); } });
document.addEventListener("drop", e => { e.preventDefault(); dragDepth = 0; composer.classList.remove("over"); if (e.dataTransfer?.files?.length) addToTray([...e.dataTransfer.files]); });
$("#send").onclick = () => submit();
promptEl.addEventListener("keydown", e => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); submit(); } });
document.querySelectorAll(".starter").forEach(b => b.onclick = () => { promptEl.value = b.dataset.p; grow(); promptEl.focus(); });
function submit() {
  if (mode === "local") {
    const files = takeTray();
    if (!files.length) { toast("Add a file first"); return; }
    if (promptEl.value.trim() && !$("#c_note").value.trim()) $("#c_note").value = promptEl.value.trim();
    promptEl.value = ""; grow(); enqueue(files);
  } else send();
}

// ---------- dictation (Web Speech API, where the browser has it)
(() => {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return;
  const mic = $("#mic"); mic.hidden = false;
  let rec = null;
  mic.onclick = () => {
    if (rec) { rec.stop(); return; }
    rec = new SR(); rec.lang = navigator.language || "en-US"; rec.interimResults = true; rec.continuous = true;
    const base = promptEl.value ? promptEl.value + " " : "";
    rec.onresult = e => { promptEl.value = base + [...e.results].map(r => r[0].transcript).join(""); grow(); };
    rec.onend = () => { rec = null; mic.classList.remove("rec"); };
    rec.onerror = () => { toast("Microphone unavailable"); };
    rec.start(); mic.classList.add("rec");
  };
})();

// ---------- agent run
async function send(packageIds = [], promptOverride = null) {
  const prompt = (promptOverride ?? promptEl.value).trim();
  const files = packageIds.length ? [] : takeTray();
  if (!files.length && !packageIds.length) { toast("Drop or paste a file first"); promptEl.focus(); return; }
  if (!agentOn) { toast("Agent is off: add OPENROUTER_API_KEY to .env"); return; }
  if (promptOverride === null) { promptEl.value = ""; grow(); }
  const run = document.createElement("div");
  run.className = "run";
  const what = packageIds.length ? `re-reading ${packageIds.length} node(s)` : files.map(f => f.name).join(", ");
  const n = files.length || packageIds.length;
  run.innerHTML = `<div class="you"><div class="av">${esc(initials())}</div><div><div class="p">${esc(prompt || "(no prompt)")}</div><div class="f">${esc(what)}</div></div></div>
    <div class="status"><div class="spin"></div><div class="steps">
      <div class="s on">Understanding your prompt…</div><div class="s">Extracting ${n} file(s) locally…</div>
      <div class="s">Reading text and images, picking what matters…</div><div class="s">Linking to the tree…</div></div></div>`;
  $("#feed").prepend(run);
  run.scrollIntoView({ behavior: "smooth", block: "center" });
  const steps = [...run.querySelectorAll(".s")]; let k = 0;
  const tick = setInterval(() => { if (k < steps.length - 1) { steps[k].className = "s done"; steps[++k].className = "s on"; } }, packageIds.length ? 4000 : 3500);
  const fd = new FormData();
  fd.append("prompt", prompt);
  files.forEach(f => fd.append("files", f, f.name));
  if (packageIds.length) fd.append("package_ids", packageIds.join(","));
  $("#send").disabled = true;
  try {
    const r = await fetch("/api/ask", { method: "POST", body: fd });
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.statusText);
    const res = await r.json();
    run.querySelector(".status").remove();
    res.items.forEach(it => run.insertAdjacentHTML("beforeend", resultHtml(it)));
    run.insertAdjacentHTML("beforeend", `<div class="foot">${res.items.length} node(s) added · $${(res.cost_usd || 0).toFixed(3)}${res.models ? ` · ${esc(res.models.router)} → ${esc(res.models.agent)}` : ""}</div>`);
    wireResults(run);
    refresh();
  } catch (err) {
    run.querySelector(".status").innerHTML = `<span style="color:var(--err)">Failed: ${esc(err.message || err)}</span>`;
  } finally { clearInterval(tick); $("#send").disabled = false; }
}
const ntc = t => `<span class="chip nt nt-${esc(t)}">${esc(String(t).replace("_", " "))}</span>`;
const imp = a => `<span class="chip imp-${esc(a.importance)}">${esc(a.importance)}</span>`;
const stc = s => `<span class="chip st-${esc(s)}">${esc(s)}</span>`;
function resultHtml(it) {
  const a = it.agent;
  const th = it.thumbnail ? `<img src="/files/${it.id}/${it.thumbnail}" alt="">` : esc((it.filename.split(".").pop() || "").toUpperCase());
  if (!a) return `<div class="res" data-id="${it.id}"><div class="th" data-open="${it.id}">${th}</div><div><div class="t">${esc(it.filename)}</div>
    <div style="color:var(--err)" class="sum">Extracted locally, but the agent failed: ${esc(it.error || "unknown")}</div>
    <div class="acts"><button class="btn" data-open="${it.id}">Open</button></div></div></div>`;
  const links = (it.links || []).map(l => `<div class="lk">→ ${esc(l.type.replace("_", " "))} <a data-open="${l.target}">${esc(parentName(l.target))}</a>${l.why ? ` · ${esc(l.why)}` : ""}</div>`).join("");
  return `<div class="res" data-id="${it.id}"><div class="th" data-open="${it.id}">${th}</div><div>
    <div class="t">${esc(a.title)}</div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin:8px 0">${ntc(a.node_type)}${imp(a)}${a.needs_decision ? `<span class="chip imp-high">needs decision</span>` : ""}<span class="muted small">${esc(it.kind)} · ${esc(it.filename)}</span></div>
    <div class="sum">${esc(a.summary)}</div>
    ${a.decision_question ? `<div class="quote">${esc(a.decision_question)}</div>` : ""}
    ${links}
    <div class="acts"><span class="muted small">${a.counts ? `${a.counts.insights} key points · ${a.counts.figures} figures · ${a.counts.links} links` : ""}</span>
      <span class="grow"></span><span data-st>${stc(a.status)}</span>
      <button class="btn" data-act="undo">Undo</button><button class="btn" data-open="${it.id}">Open</button><button class="btn primary" data-act="accept">Accept</button></div>
  </div></div>`;
}
function wireResults(root) {
  root.querySelectorAll("[data-open]").forEach(b => b.onclick = e => { e.preventDefault(); openPkg(b.dataset.open); });
  root.querySelectorAll(".res [data-act]").forEach(b => b.onclick = async () => {
    const res = b.closest(".res"), id = res.dataset.id;
    const m = await agentAction(id, b.dataset.act);
    if (b.dataset.act === "undo") {
      res.querySelector(".sum").textContent = "Agent additions removed. The local extraction is kept.";
      res.querySelectorAll(".lk, .quote, [data-act]").forEach(x => x.remove()); res.querySelector("[data-st]").innerHTML = ""; toast("Undone");
    } else { res.querySelector("[data-st]").innerHTML = stc(m.agent?.status || "accepted"); res.querySelector('[data-act="accept"]')?.remove(); toast("Accepted into the tree"); }
  });
}
async function agentAction(id, action) {
  const fd = new FormData(); fd.append("action", action);
  const r = await fetch(`/api/packages/${id}/agent`, { method: "POST", body: fd });
  const m = await r.json(); refresh(); return m;
}

// ---------- manual context (Convert only)
const KEEP = ["c_author", "c_role", "c_channel"];
const saved = store.get("uep_ctx", {}); KEEP.forEach(k => { if (saved[k]) $("#" + k).value = saved[k]; });
KEEP.forEach(k => $("#" + k).addEventListener("change", () => { store.set("uep_ctx", Object.fromEntries(KEEP.map(x => [x, $("#" + x).value]))); paintMe(); }));
const initials = () => { const n = ($("#c_author").value || "").trim(); return n ? n.split(/\s+/).map(w => w[0]).join("").slice(0, 2).toUpperCase() : "You".slice(0, 1); };
function paintMe() { $("#me").textContent = initials(); }
paintMe();
function takeContext() {
  const c = { author: $("#c_author").value, author_role: $("#c_role").value, channel: $("#c_channel").value,
              note: $("#c_note").value, intent: $("#c_intent").value, refers_to: $("#c_ref").value };
  $("#c_note").value = ""; $("#c_intent").value = ""; $("#c_ref").value = "";
  return c;
}

// ---------- paste: files → tray, text → prompt
document.addEventListener("paste", e => {
  const inField = e.target.closest && e.target.closest("input, textarea, select");
  const files = [...(e.clipboardData?.files || [])];
  if (files.length) {
    e.preventDefault();
    const stamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, "-");
    addToTray(files.map((f, i) => f.name && f.name !== "image.png" ? f :
      new File([f], `pasted_${stamp}${files.length > 1 ? "_" + (i + 1) : ""}.${(f.type.split("/")[1] || "png").replace("jpeg", "jpg")}`, { type: f.type })));
    return;
  }
  const text = e.clipboardData?.getData("text/plain");
  if (text && !inField) { e.preventDefault(); promptEl.value = (promptEl.value ? promptEl.value + "\n" : "") + text.trim(); grow(); promptEl.focus(); }
});

// ---------- local conversion queue
const pending = [];
let running = 0;
function enqueue(files) {
  if (!files.length) return;
  const ctx = takeContext();
  for (const f of files) {
    const row = document.createElement("div");
    row.className = "q";
    row.innerHTML = `<div class="spin"></div><span>${esc(f.name)}</span><span class="muted small">${(f.size / 1e6).toFixed(1)} MB · local</span><span class="st">waiting</span>`;
    $("#queue").prepend(row);
    pending.push({ f, row, ctx });
  }
  pump();
}
function pump() {
  while (running < 2 && pending.length) {
    const { f, row, ctx } = pending.shift();
    running++;
    row.querySelector(".st").textContent = "converting…";
    const fd = new FormData(); fd.append("files", f, f.name);
    for (const [k, v] of Object.entries(ctx)) if (v) fd.append(k, v);
    fetch("/api/convert", { method: "POST", body: fd })
      .then(r => r.ok ? r.json() : r.text().then(t => Promise.reject(t)))
      .then(([m]) => {
        row.classList.add("done"); row.querySelector(".spin").remove();
        const w = m.warnings.length ? ` · ${m.warnings.length} warning(s)` : "";
        row.querySelector(".st").innerHTML = `${esc(m.kind)} · ${m.chunk_count} chunks${w} · <a href="#">open</a>`;
        row.querySelector("a").onclick = e => { e.preventDefault(); openPkg(m.id); };
        setTimeout(() => row.remove(), 15000); refresh();
      })
      .catch(err => { row.classList.add("fail"); row.querySelector(".spin").remove(); row.querySelector(".st").textContent = "failed: " + String(err).slice(0, 120); })
      .finally(() => { running--; pump(); });
  }
}

// ---------- library
const ICONS = {"all": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\"><rect x=\"4\" y=\"4\" width=\"6.5\" height=\"6.5\" rx=\"1.8\"/><rect x=\"13.5\" y=\"4\" width=\"6.5\" height=\"6.5\" rx=\"1.8\"/><rect x=\"4\" y=\"13.5\" width=\"6.5\" height=\"6.5\" rx=\"1.8\"/><rect x=\"13.5\" y=\"13.5\" width=\"6.5\" height=\"6.5\" rx=\"1.8\"/></svg>", "decision": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\"><path d=\"M12 3v5M12 8l-6 5v6M12 8l6 5v6\"/></svg>", "markup": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\"><path d=\"m4 20 4-1 11-11-3-3L5 16z\"/></svg>", "document": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\"><path d=\"M7 3.5h7l4 4V20a.5.5 0 0 1-.5.5h-10A.5.5 0 0 1 7 20z\"/><path d=\"M14 3.5V8h4M9.5 12.5h5M9.5 16h5\"/></svg>", "model": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\"><path d=\"M12 3 20 7.5v9L12 21l-8-4.5v-9z\"/><path d=\"M12 12 20 7.5M12 12 4 7.5M12 12v9\"/></svg>", "media": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\"><rect x=\"3.5\" y=\"5\" width=\"17\" height=\"14\" rx=\"2.5\"/><circle cx=\"9\" cy=\"10\" r=\"1.6\"/><path d=\"m4 17 5-4 4 3 3-2 4 3\"/></svg>", "suggested": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\"><circle cx=\"12\" cy=\"12\" r=\"8\"/><path d=\"m8.5 12 2.5 2.5 4.5-5\"/></svg>"};
const FILTERS = [
  ["all", "All", () => true],
  ["decision", "Decisions", p => p.agent?.node_type === "decision" || p.agent?.needs_decision],
  ["markup", "Markups", p => p.kind === "markup" || (p.links || []).some(l => l.type === "marks_up")],
  ["document", "Documents", p => ["document", "presentation", "spreadsheet", "text", "web", "data", "email"].includes(p.kind)],
  ["model", "Models", p => p.kind === "rhino_model"],
  ["media", "Media", p => ["image", "video", "audio"].includes(p.kind)],
  ["suggested", "To review", p => p.agent?.status === "suggested"],
];
let filter = "all";
function refresh() {
  fetch("/api/packages").then(r => r.json()).then(rows => {
    library = rows; render(); paintBanner();
    const sel = $("#c_ref"), keep = sel.value;
    sel.innerHTML = `<option value="">auto-detect the original</option>` + rows.filter(r => r.kind !== "markup" && r.thumbnail)
      .map(r => `<option value="${r.id}">${esc(r.agent?.title || r.title)} (${esc(r.kind)})</option>`).join("");
    sel.value = keep;
    const dec = rows.filter(FILTERS[1][2]).filter(p => p.agent?.status !== "accepted" || p.agent?.needs_decision).length;
    $("#decCount").textContent = dec || "";
  });
}
function paintBanner() {
  const imgs = library.filter(p => p.thumbnail).slice(0, 6);
  const b = $("#banner");
  let tiles = b.querySelector(".tiles");
  if (imgs.length >= 2) {
    if (!tiles) { tiles = document.createElement("div"); tiles.className = "tiles"; b.prepend(tiles); }
    tiles.innerHTML = imgs.concat(imgs).slice(0, 6).map(p => `<div style="background-image:url('/files/${p.id}/${p.thumbnail}')"></div>`).join("");
    b.querySelector(".aurora").style.opacity = .55;
  }
  const n = library.length, dec = library.filter(FILTERS[1][2]).length, rev = library.filter(FILTERS[6][2]).length;
  $("#bannerStat").innerHTML = n ? `<span>${n} nodes</span><span>${dec} decisions</span>${rev ? `<span>${rev} to review</span>` : ""}` : "";
}
function card(p) {
  const ext = (p.filename.split(".").pop() || "").toUpperCase();
  const a = p.agent;
  const th = p.thumbnail ? `<img loading="lazy" src="/files/${p.id}/${p.thumbnail}" alt="">` : `<span class="ext">${esc(ext)}</span>`;
  const dots = p.modalities.map(m => `<span class="dot d-${m}" title="${m}"></span>`).join("");
  const who = p.author || p.author_role;
  return `<div class="card ${a ? `imp-${esc(a.importance)}-c` : ""}" data-id="${p.id}" tabindex="0">
    <div class="tag">${a ? ntc(a.node_type) : `<span class="chip">${esc(p.kind.replace("_", " "))}</span>`}${a?.status === "suggested" ? stc("suggested") : (a ? imp(a) : "")}</div>
    <div class="th k-${esc(p.kind)}">${th}</div>
    <div class="over"><div class="t" title="${esc(p.filename)}">${esc(a?.title || p.title)}</div>
      <div class="m">${dots}<span>${esc(p.kind.replace("_", " "))}</span>${who ? `<span>· ${esc(who)}</span>` : ""}${p.parent_id ? `<span>· in ${esc(parentName(p.parent_id))}</span>` : ""}${p.warnings ? `<span title="warnings">· ⚠ ${p.warnings}</span>` : ""}</div></div>
  </div>`;
}
const parentName = id => { const p = library.find(x => x.id === id); return p ? (p.agent?.title || p.title) : id; };
function render() {
  const q = $("#search").value.toLowerCase().trim();
  const kids = $("#showChildren").checked;
  const base = library.filter(p => kids || !p.parent_id);
  $("#pills").innerHTML = FILTERS.map(([k, label, fn]) => { const n = base.filter(fn).length;
    return (k === "all" || n) ? `<button class="pill ${filter === k ? "on" : ""}" data-f="${k}">${ICONS[k] || ""}${label}<span class="n">${n}</span></button>` : ""; }).join("");
  document.querySelectorAll("[data-f]").forEach(b => b.onclick = () => { filter = b.dataset.f; render(); });
  const fn = (FILTERS.find(f => f[0] === filter) || FILTERS[0])[2];
  const rows = base.filter(fn).filter(p => !q || [p.title, p.filename, p.kind, p.author, p.author_role, p.agent?.title, p.agent?.summary, p.agent?.node_type]
    .join(" ").toLowerCase().includes(q));
  $("#grid").innerHTML = rows.length ? rows.map(card).join("") : `<div class="empty">${library.length ? "Nothing matches." : "Nothing here yet. Drop a file into the box above."}</div>`;
  document.querySelectorAll(".card").forEach(c => { c.onclick = () => openPkg(c.dataset.id); c.onkeydown = e => { if (e.key === "Enter") openPkg(c.dataset.id); }; });
}
$("#search").oninput = render;
$("#showChildren").onchange = render;

// ---------- rail
document.querySelectorAll(".rail [data-go]").forEach(b => b.onclick = () => {
  const g = b.dataset.go;
  document.querySelectorAll(".rail .ic").forEach(x => x.classList.toggle("on", x === b));
  if (g === "new") { window.scrollTo({ top: 0, behavior: "smooth" }); promptEl.focus(); }
  else if (g === "feed") ($("#feed").firstElementChild || $("#feed")).scrollIntoView({ behavior: "smooth", block: "start" }) || (!$("#feed").children.length && toast("No agent runs yet"));
  else if (g === "settings") { const open = !$("#manual").classList.contains("open"); $("#manual").classList.toggle("open", open); store.set("uep_manual_open", open); if (open) $("#manual").scrollIntoView({ behavior: "smooth", block: "center" }); }
  else { filter = g === "library" ? "all" : g; render(); $("#lib").scrollIntoView({ behavior: "smooth", block: "start" }); }
});

// ---------- detail drawer
let current = null, tab = "all";
async function openPkg(id) {
  const r = await fetch(`/api/packages/${id}`);
  if (!r.ok) return;
  current = await r.json(); tab = "all";
  drawDetail();
  $("#drawer").classList.add("open"); $("#scrim").classList.add("open"); $("#drawer").scrollTop = 0;
}
function closeDrawer() { $("#drawer").classList.remove("open"); $("#scrim").classList.remove("open"); }
$("#scrim").onclick = closeDrawer;
function drawDetail() {
  const { manifest: m, chunks, backlinks = [] } = current;
  const ag = m.agent;
  const base = `/files/${m.id}/`;
  const regions = chunks.filter(c => c.role === "markup_region");
  const imgs = chunks.filter(c => c.modality === "image" && !["markup_region", "figure"].includes(c.role));
  const ctx = m.context || {};
  const ents = Object.entries(m.metadata.entities || {});
  const linkBtns = [
    ...(m.links || []).filter(l => !["part_of", "contains"].includes(l.type) && !(l.suggested_by || "").startsWith("agent")).map(l =>
      `<button class="btn" data-open="${l.target}">${l.type === "marks_up" ? "✎ marks up" : esc(l.type.replace("_", " "))}: ${esc(parentName(l.target))}${l.confidence != null && l.confidence < 1 ? ` <span class="muted">${Math.round(l.confidence * 100)}%</span>` : ""}</button>`),
    ...backlinks.map(b => `<button class="btn" data-open="${b.source}">${b.type === "marks_up" ? "✎ marked up by" : "← " + esc(b.type.replace("_", " "))}: ${esc(parentName(b.source))}</button>`)].join("");
  const counts = chunks.reduce((a, c) => (a[c.modality] = (a[c.modality] || 0) + 1, a), {});
  const shown = chunks.filter(c => tab === "all" || c.modality === tab);
  const rel = [
    m.metadata.parent_id ? `<button class="btn" data-open="${m.metadata.parent_id}">↑ in ${esc(parentName(m.metadata.parent_id))}</button>` : "",
    ...m.children.map(c => `<button class="btn" data-open="${c}">↳ ${esc(parentName(c))}</button>`)].join("");
  $("#drawer").innerHTML = `
    <div class="hd"><div style="min-width:0"><h3>${esc(ag?.title || m.title)}</h3><div class="id">${m.id} · ${esc(m.source.filename)} · ${(m.source.size_bytes / 1e6).toFixed(2)} MB</div></div>
      <div class="acts"><a class="btn" href="/api/packages/${m.id}/zip" title="Download package">↓ Package</a>
      <button class="btn" id="del" title="Delete package">Delete</button><button class="btn" id="close" aria-label="Close">✕</button></div></div>
    ${agentSection(m, chunks, base)}
    ${ctx.note || ctx.author ? `<div class="sec"><h4>Context</h4>
      <div class="muted">${esc([ctx.author, ctx.author_role && "(" + ctx.author_role + ")", ctx.channel && "via " + ctx.channel, ctx.date && "on " + ctx.date, ctx.project && "· project " + ctx.project].filter(Boolean).join(" "))}</div>
      ${ctx.note ? `<div class="quote">${esc(ctx.note)}</div>` : ""}</div>` : ""}
    ${linkBtns || rel ? `<div class="sec"><h4>Links</h4><div style="display:flex;gap:6px;flex-wrap:wrap">${linkBtns}${rel}</div></div>` : ""}
    ${regions.length ? `<div class="sec"><h4>Marked areas · ${regions.length}</h4>${regions.map(c => `<div class="region">
      ${c.asset ? `<img loading="lazy" src="${base}${c.asset}" alt="">` : "<div></div>"}
      <div><div class="muted small">${esc([c.locator.position, c.meta.colour, c.locator.page && "page " + c.locator.page, c.meta.author].filter(Boolean).join(" · "))}</div>
      ${c.locator.layers ? `<div class="ent">${c.locator.layers.map(l => `<span class="chip"><b>layer</b>${esc(l)}</span>`).join("")}</div>` : ""}
      <div class="small" style="margin-top:4px;color:var(--soft)">${esc(c.text)}</div></div></div>`).join("")}</div>` : ""}
    <div class="sec"><h4>Extracted facts</h4><div style="color:var(--soft)">${esc(m.description)}</div>
      ${ents.length ? `<div class="ent">${ents.flatMap(([k, vs]) => vs.slice(0, 12).map(v => `<span class="chip"><b>${esc(k)}</b>${esc(v)}</span>`)).join("")}</div>` : ""}
      <div class="ent">${m.tags.values.map(t => `<span class="chip">${esc(t)}</span>`).join("")}</div></div>
    ${m.warnings.length ? `<div class="sec"><div class="warnbox">${m.warnings.map(esc).join("<br>")}</div></div>` : ""}
    ${imgs.length ? `<div class="sec"><h4>Images · ${imgs.length}</h4><div class="gallery">${imgs.slice(0, 24).map(c => `<img loading="lazy" src="${base}${c.asset}" title="${esc(c.text)}" alt="">`).join("")}</div></div>` : ""}
    <div class="sec"><h4>Chunks · ${chunks.length}</h4>
      <div class="tabs">${["all", "text", "image", "audio", "video"].filter(t => t === "all" || counts[t]).map(t =>
        `<button class="pill ${t === tab ? "on" : ""}" data-tab="${t}">${t}${t === "all" ? "" : `<span class="n">${counts[t]}</span>`}</button>`).join("")}</div>
      ${shown.map(c => chunkHtml(c, base)).join("")}</div>
    <div class="sec"><details><summary>manifest.json</summary><pre>${esc(JSON.stringify(m, null, 2))}</pre></details></div>`;
  $("#close").onclick = closeDrawer;
  $("#del").onclick = async () => {
    if (!confirm(`Delete package ${m.id}? The original file is not affected.`)) return;
    await fetch(`/api/packages/${m.id}`, { method: "DELETE" });
    closeDrawer(); refresh(); toast("Deleted");
  };
  document.querySelectorAll("#drawer [data-ag]").forEach(b => b.onclick = async () => {
    const act = b.dataset.ag;
    if (act === "run") { b.disabled = true; b.textContent = "Reading…"; await send([m.id], $("#agprompt").value); }
    else { await agentAction(m.id, act); toast(act === "accept" ? "Accepted into the tree" : "Agent additions removed"); }
    openPkg(m.id);
  });
  document.querySelectorAll("#drawer [data-tab]").forEach(b => b.onclick = () => { tab = b.dataset.tab; drawDetail(); });
  document.querySelectorAll("#drawer [data-open]").forEach(b => b.onclick = e => { e.preventDefault(); openPkg(b.dataset.open); });
  document.querySelectorAll("#drawer .gallery img, #drawer .chunk img, #drawer .region img").forEach(i => i.onclick = () => { $("#lightbox img").src = i.src; $("#lightbox").style.display = "grid"; });
}
function agentSection(m, chunks, base) {
  const ag = m.agent;
  const ask = `<div style="display:flex;gap:8px;margin-top:14px"><input id="agprompt" class="field" placeholder="${ag ? "Re-read with a different focus…" : "Optional: what should the agent focus on?"}">
     <button class="btn ${ag ? "" : "primary"}" data-ag="run" ${agentOn ? "" : "disabled"} style="flex-shrink:0">${ag ? "Re-read" : "Ask the agent"}</button></div>`;
  if (!ag) return `<div class="sec agentbox"><h4>Agent</h4><div class="muted">Not read by the agent yet. It can pull out the meaning, figures and links.</div>${ask}</div>`;
  const by = c => (c.meta?.suggested_by || "").startsWith("agent");
  const ins = chunks.filter(c => by(c) && c.role === "insight");
  const figs = chunks.filter(c => by(c) && c.role === "figure");
  const agLinks = (m.links || []).filter(l => (l.suggested_by || "").startsWith("agent"));
  return `<div class="sec agentbox"><h4>Agent reading · <span style="text-transform:none;letter-spacing:0">${esc(ag.model)}</span></h4>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px">${ntc(ag.node_type)}${imp(ag)}${stc(ag.status)}
      ${ag.needs_decision ? `<span class="chip imp-high">needs decision</span>` : ""}${(m.tags.agent_values || []).map(t => `<span class="chip">${esc(t)}</span>`).join("")}</div>
    <div style="font-size:15px">${esc(ag.summary)}</div>
    ${ag.decision_question ? `<div class="quote">${esc(ag.decision_question)}</div>` : ""}
    ${ag.importance_reason ? `<div class="muted small">Why ${esc(ag.importance)}: ${esc(ag.importance_reason)}</div>` : ""}
    ${(ag.owner || ag.due) ? `<div class="muted small">${ag.owner ? "Owner: " + esc(ag.owner) : ""} ${ag.due ? "· Due: " + esc(ag.due) : ""}</div>` : ""}
    ${ins.length ? `<div class="sub"><h4>Key points · ${ins.length}</h4>${ins.map(c => `<div class="insight">${ntc(c.meta.node_type)} ${esc(c.text)}
      ${c.meta.why ? `<div class="why">${esc(c.meta.why)}${c.locator.page ? ` · page ${c.locator.page}` : ""}</div>` : ""}</div>`).join("")}</div>` : ""}
    ${figs.length ? `<div class="sub"><h4>Figures worth keeping · ${figs.length}</h4><div class="gallery">${figs.map(c =>
      `<figure><img loading="lazy" src="${base}${c.asset}" alt=""><figcaption>${esc(c.text)}</figcaption></figure>`).join("")}</div></div>` : ""}
    ${(ag.markup_text || []).length ? `<div class="sub"><h4>Written on the markup</h4>${ag.markup_text.map(t => `<div class="quote">${esc(t.text)}</div>`).join("")}</div>` : ""}
    ${agLinks.length ? `<div class="sub"><h4>Suggested links</h4>${agLinks.map(l => `<div class="lk">→ ${esc(l.type.replace("_", " "))}
      <a data-open="${l.target}">${esc(parentName(l.target))}</a> <span>${Math.round((l.confidence || 0) * 100)}% · ${esc(l.why || "")}</span></div>`).join("")}</div>` : ""}
    <div class="acts">${ag.status !== "accepted" ? `<button class="btn primary" data-ag="accept">Accept</button>` : ""}<button class="btn" data-ag="undo">Undo agent</button></div>
    ${ask}</div>`;
}
function chunkHtml(c, base) {
  const loc = Object.entries(c.locator || {}).map(([k, v]) => `${k}: ${Array.isArray(v) ? v.join(",") : v}`).join(" · ");
  let media = "";
  if (c.modality === "image") media = `<img loading="lazy" src="${base}${c.asset}" alt="">`;
  if (c.modality === "audio") media = `<audio controls preload="none" src="${base}${c.asset}"></audio>`;
  if (c.modality === "video") media = `<video controls preload="none" src="${base}${c.asset}"></video>`;
  return `<div class="chunk"><div class="ch"><span class="dot d-${c.modality}"></span><b>${c.modality}</b><span class="chip">${esc(c.role)}</span>
    ${(c.meta?.suggested_by || "").startsWith("agent") ? `<span class="chip st-suggested">agent</span>` : ""}
    ${loc ? `<span>${esc(loc)}</span>` : ""}<code>${esc(c.id)}</code></div>${media}<pre>${esc(c.text)}</pre></div>`;
}
$("#lightbox").onclick = () => $("#lightbox").style.display = "none";
document.addEventListener("keydown", e => { if (e.key === "Escape") { $("#lightbox").style.display = "none"; closeDrawer(); $("#modeMenu").classList.remove("open"); } });

refresh();
</script>
</body>
</html>
